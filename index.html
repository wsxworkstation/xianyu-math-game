<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="适合中一学生的正负数加减与创业理财游戏">
  <title>翻身吧咸鱼</title>
  <style>
    :root {
      --ink: #183153;
      --muted: #637083;
      --paper: #fffdf7;
      --yellow: #ffd84d;
      --orange: #ff8a3d;
      --blue: #4c78ff;
      --blue-dark: #284cbd;
      --mint: #41c7a4;
      --red: #ef5b5b;
      --purple: #8c63e7;
      --line: #d9e0ec;
      --shadow: 8px 8px 0 rgba(36, 61, 112, .18);
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: #eaf4ff; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background-color: #eaf4ff;
      background-image:
        linear-gradient(90deg, rgba(76,120,255,.06) 2px, transparent 2px),
        linear-gradient(rgba(76,120,255,.06) 2px, transparent 2px),
        linear-gradient(135deg, #eff8ff 0 50%, #fff7db 50% 100%);
      background-size: 24px 24px, 24px 24px, 100% 100%;
    }

    button, input { font: inherit; }
    button { touch-action: manipulation; }

    .app-shell {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 34px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .brand-badge {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--yellow);
      box-shadow: 4px 4px 0 var(--ink);
      transform: rotate(-3deg);
      font-size: 1.45rem;
    }

    .brand-title { font-size: clamp(1rem, 2.2vw, 1.28rem); }

    .icon-button {
      width: 44px;
      height: 44px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: white;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
    }

    .icon-button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

    .screen { display: none; }
    .screen.active { display: block; animation: rise .35s ease both; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel {
      background: rgba(255,255,255,.92);
      border: 3px solid var(--ink);
      border-radius: var(--radius);
      box-shadow: 8px 8px 0 rgba(24,49,83,.16);
    }

    .start-card {
      display: grid;
      grid-template-columns: 1.12fr .88fr;
      min-height: min(690px, calc(100vh - 100px));
      overflow: hidden;
    }

    .start-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(28px, 6vw, 70px);
    }

    .eyebrow {
      width: fit-content;
      margin: 0 0 16px;
      padding: 7px 13px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--yellow);
      font-weight: 900;
      transform: rotate(-1deg);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.45rem, 7vw, 5.4rem);
      line-height: .98;
      letter-spacing: -.055em;
      text-shadow: 5px 5px 0 rgba(76,120,255,.14);
    }

    .title-accent { color: var(--blue); }

    .lead {
      max-width: 570px;
      margin: 24px 0;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.75;
    }

    .quick-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 28px;
    }

    .fact {
      padding: 8px 12px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font-weight: 800;
    }

    .start-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      max-width: 580px;
    }

    .field { display: grid; gap: 7px; }
    .field label { font-weight: 900; }

    .field input {
      width: 100%;
      min-height: 50px;
      padding: 0 15px;
      border: 2px solid var(--ink);
      border-radius: 13px;
      background: white;
      color: var(--ink);
      outline: none;
    }

    .field input:focus { box-shadow: 0 0 0 4px rgba(76,120,255,.2); }

    .primary-btn, .secondary-btn, .answer-btn, .choice-btn {
      min-height: 50px;
      border: 2px solid var(--ink);
      border-radius: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }

    .primary-btn {
      grid-column: 1 / -1;
      background: var(--blue);
      color: white;
      box-shadow: 5px 5px 0 var(--ink);
    }

    .primary-btn:hover, .secondary-btn:hover, .answer-btn:hover, .choice-btn:hover { filter: brightness(1.04); transform: translateY(-2px); }
    .primary-btn:active, .secondary-btn:active, .answer-btn:active, .choice-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
    button:disabled { cursor: not-allowed; filter: grayscale(.4); opacity: .62; transform: none !important; }

    .start-art {
      position: relative;
      display: grid;
      place-items: center;
      padding: 34px;
      overflow: hidden;
      background-color: #3158cd;
      background-image:
        linear-gradient(45deg, rgba(255,255,255,.08) 25%, transparent 25% 75%, rgba(255,255,255,.08) 75%),
        linear-gradient(45deg, rgba(255,255,255,.08) 25%, transparent 25% 75%, rgba(255,255,255,.08) 75%);
      background-position: 0 0, 14px 14px;
      background-size: 28px 28px;
      border-left: 3px solid var(--ink);
    }

    .art-board {
      width: min(370px, 100%);
      padding: 10px;
      border: 4px solid var(--ink);
      border-radius: 5px;
      background: var(--ink);
      box-shadow: 12px 12px 0 rgba(24,49,83,.5);
      text-align: center;
    }

    .pixel-hero {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center;
      border: 3px solid white;
      image-rendering: pixelated;
    }
    .art-equation { margin: 0; padding: 13px 8px 4px; color: white; font-size: clamp(1.35rem, 3vw, 2rem); font-weight: 1000; letter-spacing: .02em; }
    .art-note { margin: 3px 0 6px; color: var(--yellow); font-weight: 900; }

    .dashboard {
      display: grid;
      grid-template-columns: 265px 1fr;
      gap: 16px;
    }

    .sidebar { display: grid; align-content: start; gap: 14px; }

    .stat-card { padding: 18px; }
    .stat-label { margin: 0 0 5px; color: var(--muted); font-size: .86rem; font-weight: 800; }
    .money-row { position: relative; display: flex; align-items: center; gap: 10px; margin: 0; }
    .money { margin: 0; font-size: 2.25rem; font-weight: 1000; color: var(--mint); letter-spacing: -.04em; }
    .money.negative { color: var(--red); }
    .money-delta { padding: 4px 9px; border: 2px solid var(--ink); border-radius: 999px; background: var(--yellow); font-weight: 900; font-size: .88rem; opacity: 0; transform: translateY(4px); transition: opacity .25s ease, transform .25s ease; }
    .money-delta.show { opacity: 1; transform: translateY(0); }
    .money-delta.positive { background: #c9f7e7; }
    .money-delta.negative { background: #ffd7d7; }
    .session-balance { margin-top: 14px; padding-top: 13px; border-top: 2px dashed var(--line); }
    .session-profit { margin: 2px 0 0; font-size: 1.3rem; font-weight: 1000; color: var(--blue-dark); }
    .session-profit.loss { color: var(--red); }

    .job-card { padding: 18px; background: #fff7cf; }
    .job-head { display: flex; align-items: center; gap: 12px; }
    .job-avatar { position: relative; width: 62px; height: 62px; flex: none; }
    .job-photo { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; border: 3px solid var(--ink); border-radius: 14px; background: #fff; image-rendering: pixelated; }
    .job-icon-badge { position: absolute; right: -8px; bottom: -8px; display: grid; place-items: center; width: 30px; height: 30px; border: 2px solid var(--ink); border-radius: 50%; background: var(--yellow); font-size: 1.05rem; }
    .job-avatar:has(.job-photo[hidden]) .job-icon-badge { position: static; width: 100%; height: 100%; border-radius: 14px; font-size: 2.2rem; box-shadow: none; }
    .job-title { margin: 0; font-size: 1.25rem; }
    .job-desc { margin: 12px 0 0; color: var(--muted); line-height: 1.55; }
    .job-income { margin: 12px 0 0; font-weight: 900; color: var(--blue-dark); }
    .job-trait { margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; font-weight: 800; font-size: .88rem; line-height: 1.45; }
    .job-trait.good { background: #d9faee; color: #126750; }
    .job-trait.bad { background: #ffe0e0; color: #9c2f2f; }

    .mini-card { padding: 17px; }
    .mini-row { display: flex; justify-content: space-between; gap: 12px; margin: 7px 0; }
    .mini-row strong { text-align: right; }

    .effects-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .effect-chip { padding: 6px 10px; border: 2px solid var(--ink); border-radius: 999px; background: #eafff3; font-weight: 800; font-size: .86rem; cursor: help; }

    .main-stage { min-width: 0; }
    .game-header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 17px 20px;
      margin-bottom: 16px;
    }

    .progress-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .progress-meta strong { font-size: 1.13rem; }
    .progress-meta span { color: var(--muted); font-weight: 800; }
    .progress-track { height: 12px; border: 2px solid var(--ink); border-radius: 999px; background: #e7ecf5; overflow: hidden; }
    .progress-fill { height: 100%; width: 10%; background: linear-gradient(90deg, var(--yellow), var(--orange)); transition: width .35s ease; }

    .timer {
      min-width: 110px;
      padding: 10px 14px;
      border: 3px solid var(--ink);
      border-radius: 16px;
      background: var(--ink);
      color: white;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
    }

    .timer.warning { background: var(--red); animation: pulse .8s infinite alternate; }
    @keyframes pulse { to { transform: scale(1.035); } }

    .stage-card {
      min-height: 540px;
      padding: clamp(22px, 4vw, 38px);
    }

    .stage-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
      padding: 6px 11px;
      border-radius: 999px;
      background: #e8eeff;
      color: var(--blue-dark);
      font-weight: 900;
    }

    .stage-title { margin: 0 0 12px; font-size: clamp(1.65rem, 4vw, 2.55rem); line-height: 1.2; }
    .stage-text { margin: 0 0 22px; color: var(--muted); font-size: 1.03rem; line-height: 1.7; }

    .question-box {
      padding: clamp(20px, 4vw, 30px);
      border: 3px dashed var(--blue);
      border-radius: 20px;
      background: #f7f9ff;
      text-align: center;
    }

    .story { margin: 0 auto 16px; max-width: 680px; line-height: 1.65; }
    .equation { margin: 0; font-size: clamp(2rem, 6vw, 3.8rem); font-weight: 1000; letter-spacing: -.04em; }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 22px;
    }

    .answer-btn {
      background: white;
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      font-size: 1.1rem;
    }

    .answer-btn.correct { background: #c9f7e7; }
    .answer-btn.wrong { background: #ffd7d7; }

    .feedback {
      min-height: 56px;
      margin-top: 18px;
      padding: 13px 16px;
      border-radius: 14px;
      background: #eef2f8;
      line-height: 1.55;
      font-weight: 800;
    }

    .feedback.success { background: #d9faee; color: #126750; }
    .feedback.error { background: #ffe0e0; color: #9c2f2f; }

    .number-line {
      display: grid;
      grid-template-columns: repeat(5, minmax(42px, 1fr));
      gap: 4px;
      max-width: 430px;
      margin: 13px auto 2px;
      padding-top: 9px;
      border-top: 4px solid currentColor;
    }

    .number-point {
      position: relative;
      padding: 5px 2px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .number-point::before {
      content: "";
      position: absolute;
      top: -13px;
      left: 50%;
      width: 3px;
      height: 9px;
      background: currentColor;
    }

    .number-point.answer {
      border: 2px solid currentColor;
      background: white;
      font-weight: 1000;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 22px;
      perspective: 1000px;
    }

    .draw-card {
      position: relative;
      min-height: 270px;
      border: 0;
      background: transparent;
      cursor: pointer;
      perspective: 1000px;
    }

    .draw-card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.2,.75,.25,1);
    }

    .draw-card.revealed .draw-card-inner { transform: rotateY(180deg); }
    .draw-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      border: 3px solid var(--ink);
      border-radius: 19px;
      backface-visibility: hidden;
      box-shadow: 6px 7px 0 rgba(24,49,83,.18);
    }

    .card-back {
      background:
        linear-gradient(45deg, transparent 45%, rgba(255,255,255,.22) 46% 54%, transparent 55%),
        var(--blue);
      background-size: 28px 28px;
      color: white;
    }

    .card-back-icon { font-size: 3.8rem; }
    .card-back-text { margin-top: 8px; font-weight: 1000; }

    .card-front { transform: rotateY(180deg); background: white; text-align: center; }
    .card-front.good { background: #dff9ef; }
    .card-front.bad { background: #ffe2df; }
    .card-front.risk { background: #fff2c6; }
    .card-category { padding: 4px 8px; border: 2px solid currentColor; border-radius: 4px; font-size: .78rem; font-weight: 1000; }
    .card-icon { font-size: 3rem; }
    .card-title { margin: 10px 0 7px; font-size: 1.15rem; font-weight: 1000; }
    .card-copy { margin: 0; color: var(--muted); line-height: 1.45; }
    .card-value { margin-top: 11px; font-weight: 1000; color: var(--blue-dark); }
    .select-card { margin-top: 13px; padding: 8px 13px; border: 2px solid var(--ink); border-radius: 10px; background: var(--yellow); font-weight: 900; }
    .draw-card.selected .draw-face { outline: 5px solid var(--yellow); outline-offset: 3px; }

    .decision-box {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 22px;
      align-items: center;
      margin-top: 22px;
      padding: 24px;
      border: 3px solid var(--ink);
      border-radius: 20px;
      background: #fff7d7;
    }

    .decision-icon { font-size: 4.5rem; text-align: center; }
    .decision-title { margin: 0 0 8px; font-size: 1.35rem; }
    .decision-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
    .choice-btn { background: white; color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
    .choice-btn.trust { background: #fff0aa; }
    .choice-btn.refuse { background: #dff3ff; }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 22px;
    }

    .category-btn {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 14px;
      align-items: center;
      min-height: 104px;
      padding: 15px;
      border: 3px solid var(--ink);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
      cursor: pointer;
      text-align: left;
    }

    .category-btn:hover { transform: translateY(-2px); background: #fff8d5; }
    .category-icon { font-size: 2.7rem; text-align: center; }
    .category-name { display: block; font-size: 1.12rem; font-weight: 1000; }
    .category-desc { display: block; margin-top: 4px; color: var(--muted); font-size: .88rem; line-height: 1.45; }

    .chance-badge {
      display: inline-block;
      padding: 6px 10px;
      border: 2px solid var(--ink);
      border-radius: 4px;
      background: #d9faee;
      font-weight: 1000;
    }

    .session-outcome {
      margin: 18px 0;
      padding: 18px;
      border: 3px solid var(--ink);
      border-radius: 8px;
      background: #dff9ef;
      text-align: center;
    }

    .session-outcome.loss { background: #ffe2df; }
    .session-outcome span { display: block; color: var(--muted); font-weight: 900; }
    .session-outcome strong { display: block; margin-top: 4px; font-size: clamp(1.8rem, 4vw, 2.7rem); }

    .report-hero { display: grid; grid-template-columns: 96px 1fr; gap: 20px; align-items: center; }
    .report-icon { display: grid; place-items: center; width: 90px; height: 90px; border: 3px solid var(--ink); border-radius: 25px; background: var(--yellow); font-size: 3.1rem; transform: rotate(-3deg); }
    .report-list { display: grid; gap: 10px; margin: 24px 0; }
    .report-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; padding: 13px 15px; border-radius: 7px; background: #f0f4fa; }
    .report-row > span:nth-child(2) { font-weight: 1000; }
    .report-row-equation { grid-column: 1 / -1; color: var(--blue-dark); font-size: .92rem; font-weight: 900; }
    .report-equation { padding: 18px; border: 2px dashed var(--blue); border-radius: 15px; background: #f8faff; font-size: 1.15rem; font-weight: 900; text-align: center; }
    .report-next { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 22px; }
    .auto-next { color: var(--muted); font-weight: 800; }
    .secondary-btn { padding: 0 22px; background: var(--blue); color: white; box-shadow: 4px 4px 0 var(--ink); }

    .end-card { padding: clamp(28px, 6vw, 60px); text-align: center; }
    .trophy { font-size: clamp(5rem, 14vw, 9rem); filter: drop-shadow(8px 9px 0 rgba(24,49,83,.15)); }
    .end-title { margin: 12px 0 6px; font-size: clamp(2rem, 6vw, 4rem); }
    .end-subtitle { margin: 0; color: var(--blue-dark); font-size: 1.25rem; font-weight: 1000; }
    .end-money { margin: 22px 0; font-size: clamp(2.4rem, 7vw, 4.8rem); font-weight: 1000; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 820px; margin: 26px auto; }
    .summary-item { padding: 16px 10px; border: 2px solid var(--line); border-radius: 15px; background: #f8faff; }
    .summary-item span { display: block; color: var(--muted); font-size: .85rem; font-weight: 800; }
    .summary-item strong { display: block; margin-top: 5px; font-size: 1.25rem; }
    .end-note { max-width: 620px; margin: 0 auto 24px; color: var(--muted); line-height: 1.65; }
    .end-actions { display: flex; justify-content: center; gap: 12px; }
    .end-actions .primary-btn { grid-column: auto; padding: 0 30px; }

    .job-reveal {
      display: grid;
      place-items: center;
      min-height: 455px;
      text-align: center;
    }

    .job-reveal-icon {
      display: grid;
      place-items: center;
      width: 126px;
      height: 126px;
      margin: 0 auto 20px;
      border: 4px solid var(--ink);
      border-radius: 8px;
      background: var(--yellow);
      box-shadow: 9px 9px 0 var(--ink);
      font-size: 4.5rem;
      animation: jobPop .55s steps(4, end) both;
    }

    .job-reveal-avatar { position: relative; width: 172px; height: 172px; margin: 0 auto 20px; }
    .job-reveal-photo { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; border: 4px solid var(--ink); border-radius: 20px; box-shadow: 9px 9px 0 var(--ink); background: #fff; image-rendering: pixelated; animation: jobPop .55s steps(4, end) both; }
    .job-reveal-icon-badge { position: absolute; right: -14px; bottom: -14px; display: grid; place-items: center; width: 56px; height: 56px; border: 3px solid var(--ink); border-radius: 50%; background: var(--yellow); font-size: 1.9rem; box-shadow: 4px 4px 0 var(--ink); }

    @keyframes jobPop {
      from { transform: scale(.55) rotate(-8deg); opacity: 0; }
      to { transform: scale(1) rotate(2deg); opacity: 1; }
    }

    .job-reveal .secondary-btn { margin-top: 20px; min-width: 220px; }

    .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 20px; }
    .shop-item { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start; padding: 14px; border: 3px solid var(--ink); border-radius: 14px; background: white; box-shadow: 5px 5px 0 rgba(24,49,83,.14); }
    .shop-item.owned { background: #eafff3; }
    .shop-icon { font-size: 2.2rem; text-align: center; }
    .shop-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .shop-name { font-size: 1.02rem; }
    .shop-tag { padding: 2px 8px; border: 2px solid var(--line); border-radius: 999px; font-size: .72rem; font-weight: 900; color: var(--blue-dark); }
    .shop-desc { margin: 6px 0 10px; color: var(--muted); font-size: .9rem; line-height: 1.5; }
    .shop-buy { grid-column: 1 / -1; min-height: 40px; border: 2px solid var(--ink); border-radius: 10px; background: var(--yellow); font-weight: 900; cursor: pointer; }
    .shop-buy:disabled { cursor: not-allowed; filter: grayscale(.3); opacity: .7; }

    .scam-hint { margin: 12px 0 0; padding: 11px 14px; border: 2px dashed var(--blue); border-radius: 10px; background: #eef4ff; color: var(--blue-dark); font-weight: 800; line-height: 1.5; }

    .walk-line-wrap { position: relative; margin: 26px auto 6px; max-width: 640px; }
    .walk-avatar-track { position: relative; height: 68px; margin-bottom: 2px; }
    .walk-avatar-token { position: absolute; top: 0; width: 54px; height: 54px; transform: translateX(-50%); transition: left .28s cubic-bezier(.34,1.4,.6,1); }
    .walk-avatar-token.facing-left img, .walk-avatar-token.facing-left .walk-avatar-icon { transform: scaleX(-1); }
    .walk-avatar-token.stepping { animation: walkHop .28s ease-out; }
    @keyframes walkHop { 40% { transform: translateX(-50%) translateY(-9px) rotate(-4deg); } 100% { transform: translateX(-50%) translateY(0) rotate(0); } }
    .walk-avatar-token img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; border: 3px solid var(--ink); border-radius: 50%; background: #fff; box-shadow: 3px 3px 0 var(--ink); image-rendering: pixelated; }
    .walk-avatar-icon { display: grid; place-items: center; width: 100%; height: 100%; border: 3px solid var(--ink); border-radius: 50%; background: var(--yellow); font-size: 1.6rem; box-shadow: 3px 3px 0 var(--ink); }
    .walk-ticks { display: grid; grid-template-columns: repeat(21, 1fr); border-top: 4px solid var(--ink); padding-top: 8px; }
    .walk-tick { position: relative; text-align: center; font-size: .74rem; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
    .walk-tick::before { content: ""; position: absolute; top: -12px; left: 50%; width: 3px; height: 9px; background: currentColor; transform: translateX(-50%); }
    .walk-tick.zero { color: var(--blue-dark); font-weight: 1000; }
    .walk-controls { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 16px 0; flex-wrap: wrap; }
    .walk-arrow-btn { min-width: 110px; min-height: 52px; font-size: 1.15rem; }
    .walk-position-readout { font-weight: 900; font-size: 1.05rem; }
    .walk-confirm-btn { min-width: 220px; }

    .wheel-wrap { position: relative; width: 310px; height: 310px; margin: 18px auto 22px; }
    .wheel-pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 2rem; z-index: 3; color: var(--red); filter: drop-shadow(2px 2px 0 var(--ink)); }
    .wheel-dial {
      position: relative;
      width: 100%; height: 100%;
      --label-offset: -108px;
      border-radius: 50%;
      border: 4px solid var(--ink);
      box-shadow: 6px 6px 0 rgba(24,49,83,.2);
      background: conic-gradient(
        #ffe08a 0deg 45deg, #a7e8d4 45deg 90deg, #ffd0d0 90deg 135deg, #cfe0ff 135deg 180deg,
        #ffe08a 180deg 225deg, #a7e8d4 225deg 270deg, #ffd0d0 270deg 315deg, #cfe0ff 315deg 360deg
      );
    }
    .wheel-dial::after { content: ""; position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; transform: translate(-50%, -50%); border: 4px solid var(--ink); border-radius: 50%; background: var(--yellow); box-shadow: 2px 2px 0 rgba(24,49,83,.25); }
    .wheel-slice-label { position: absolute; top: 50%; left: 50%; width: 68px; margin-left: -34px; margin-top: -18px; text-align: center; font-size: .7rem; line-height: 1.15; font-weight: 1000; transform-origin: center; pointer-events: none; }
    .wheel-slice-label span { display: block; text-shadow: 0 1px rgba(255,255,255,.65); }
    .wheel-slice-label span:first-child { font-size: 1.08rem; }
    .wheel-wrap.spinning .wheel-dial { box-shadow: 0 0 0 6px rgba(255,216,77,.5), 6px 6px 0 rgba(24,49,83,.2); }
    .wheel-wrap.spinning .wheel-pointer { animation: pointerTick .12s linear infinite alternate; }
    @keyframes pointerTick { from { transform: translateX(-50%) rotate(-9deg); } to { transform: translateX(-50%) rotate(9deg); } }

    .wheel-result {
      display: grid;
      gap: 4px;
      justify-items: center;
      max-width: 340px;
      margin: 16px auto 0;
      padding: 14px 18px;
      border: 3px solid var(--ink);
      border-radius: 16px;
      background: #eafff3;
      font-weight: 900;
      box-shadow: 5px 5px 0 rgba(24,49,83,.18);
      animation: prizePop .4s cubic-bezier(.2,1.4,.5,1) both;
    }
    .wheel-result.loss { background: #ffe2df; }
    .wheel-result.jackpot { background: #fff2c6; animation: prizePop .4s cubic-bezier(.2,1.4,.5,1) both, jackpotGlow .7s ease-in-out 3; }
    .wheel-result-icon { font-size: 2.4rem; }
    @keyframes prizePop { from { opacity: 0; transform: scale(.6) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes jackpotGlow { 50% { box-shadow: 0 0 0 8px rgba(255,216,77,.55), 5px 5px 0 rgba(24,49,83,.18); } }

    .negative-tip {
      margin: 14px 0 0;
      padding: 13px 15px;
      border: 2px solid var(--red);
      border-radius: 7px;
      background: #fff0f0;
      color: #8f2e2e;
      font-weight: 900;
      line-height: 1.55;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 20;
      width: min(520px, calc(100% - 30px));
      padding: 13px 18px;
      border: 2px solid var(--ink);
      border-radius: 14px;
      background: var(--ink);
      color: white;
      box-shadow: var(--shadow);
      font-weight: 800;
      text-align: center;
      transform: translate(-50%, 140%);
      transition: transform .25s ease;
    }
    .toast.show { transform: translate(-50%, 0); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 840px) {
      .start-card { grid-template-columns: 1fr; }
      .start-art { min-height: 260px; border-left: 0; border-top: 3px solid var(--ink); }
      .art-board { padding: 20px; }
      .dashboard { grid-template-columns: 1fr; }
      .sidebar { grid-template-columns: 1fr 1fr; }
      .job-card { grid-row: span 2; }
    }

    @media (max-width: 620px) {
      .app-shell { width: min(100% - 18px, 1120px); padding-top: 10px; }
      .topbar { margin-bottom: 9px; }
      .start-copy { padding: 27px 20px; }
      .start-form, .answers, .decision-actions { grid-template-columns: 1fr; }
      .start-art { padding: 24px; }
      .sidebar { grid-template-columns: 1fr 1fr; }
      .job-card { grid-column: 1 / -1; grid-row: auto; }
      .game-header { grid-template-columns: 1fr auto; padding: 12px; }
      .timer { min-width: 92px; font-size: 1.16rem; }
      .stage-card { min-height: 510px; padding: 20px 15px; }
      .card-grid { grid-template-columns: 1fr; }
      .draw-card { min-height: 215px; }
      .decision-box, .report-hero { grid-template-columns: 1fr; text-align: center; }
      .category-grid, .shop-grid { grid-template-columns: 1fr; }
      .decision-icon, .report-icon { margin: 0 auto; }
      .report-next { flex-direction: column; align-items: stretch; text-align: center; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
      .walk-tick { font-size: .6rem; }
      .walk-arrow-btn { min-width: 88px; min-height: 46px; font-size: 1rem; }
      .wheel-wrap { width: 250px; height: 250px; }
      .wheel-dial { --label-offset: -84px; }
      .wheel-slice-label { width: 58px; margin-left: -29px; font-size: .61rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

      function beep(freq = 440, duration = .1, type = 'sine', volume = .045) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      }

      function tone(freq, delay, duration, type = 'sine', volume = .05, sweepTo = null) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const t0 = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (sweepTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, sweepTo), t0 + duration);
        gain.gain.setValueAtTime(.0001, t0);
        gain.gain.exponentialRampToValueAtTime(volume, t0 + .012);
        gain.gain.exponentialRampToValueAtTime(.0001, t0 + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + duration + .03);
      }

      function noiseBurst(delay, duration, volume = .04, filterFreq = 1200) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const t0 = ctx.currentTime + delay;
        const len = Math.max(1, Math.floor(ctx.sampleRate * duration));
        const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < len; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = filterFreq;
        const gain = ctx.createGain();
        gain.gain.value = volume;
        src.connect(filter).connect(gain).connect(ctx.destination);
        src.start(t0);
      }

      function makeQuestion() {
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const s = state.session;
        let a, b, op;

        if (s <= 2) {
          op = Math.random() < .5 ? '+' : '−';
          if (op === '+') { a = rand(1, 9); b = rand(1, 9); }
          else { a = rand(4, 10); b = rand(1, a - 1); }
        } else if (s <= 4) {
          op = '−';
          a = rand(1, 9);
          b = rand(a + 1, a + 9);
        } else if (s <= 6) {
          op = '+';
          a = -rand(2, 10);
          b = rand(1, 12);
        } else if (s <= 8) {
          op = '−';
          if (Math.random() < .5) { a = rand(1, 10); b = -rand(1, 9); }
          else { a = -rand(1, 9); b = rand(1, 10); }
        } else {
          const kind = Math.random();
          if (kind < .34) { op = '+'; a = -rand(10, 20); b = rand(10, 20); }
          else if (kind < .67) { op = '−'; a = rand(10, 20); b = -rand(10, 20); }
          else { op = '−'; a = rand(10, 20); b = rand(10, 20); }
        }

        const answer = op === '+' ? a + b : a - b;
        const story = questionStory(a, b, op);
        const choices = new Set([answer]);
        if (-answer !== answer) choices.add(-answer);
        for (const offset of shuffle([-5, -3, -2, -1, 1, 2, 3, 5])) {
          if (choices.size >= 4) break;
          choices.add(answer + offset);
        }
        let fallbackOffset = 6;
        while (choices.size < 4) choices.add(answer + fallbackOffset++);
        return { a, b, op, answer, story, options: shuffle([...choices].slice(0, 4)) };
      }

      function questionStory(a, b, op) {
        if (op === '+' && b < 0) return a < 0
          ? `你目前欠了${Math.abs(a)}金币，今天又增加${Math.abs(b)}金币支出。现金会变成多少？`

        if (op === '+') return a < 0 ? `你目前欠了${Math.abs(a)}金币，今天赚到${b}金币。现金会变成多少？` : `你有${a}金币，今天又赚到${b}金币。一共有多少？`;
        if (b < 0) return `你的账目是${cash(a)}，一笔${Math.abs(b)}金币的欠款被取消。现金变化是多少？`;
        return a < 0
          ? `你目前欠了${Math.abs(a)}金币，还需要支付${b}金币的创业费用。现金会变成多少？`
          : `你有${a}金币，需要支付${b}金币的创业费用。还剩多少？`;
      }

        stage.innerHTML = `

          <h2 class="stage-title">认真算一算！</h2>

          <div class="question-box">
            <p class="story">${q.story}</p>
            <p class="equation">${mathNumber(q.a)} ${q.op} ${operatorNumber(q.b)} = ?</p>
            <div class="answers">${q.options.map(v => `<button class="answer-btn" type="button" data-answer="${v}">${v}</button>`).join('')}</div>
          </div>
          <div id="feedback" class="feedback">请选择一个答案。</div>`;

        stage.querySelectorAll('.answer-btn').forEach(btn => btn.addEventListener('click', () => answerQuestion(Number(btn.dataset.answer), btn)));

      function answerQuestion(value, button) {
        if (state.phase !== 'question') return;
        const q = state.question;
        state.attempts += 1;
        const isCorrect = value === q.answer;
        button.disabled = true;
        button.classList.add(isCorrect ? 'correct' : 'wrong');

        const canRetry = !isCorrect && state.attempts === 1 && state.activeEffects.retryTicket;
        if (canRetry) {
          state.activeEffects.retryTicket = false;
          renderActiveEffects();
          playResult(false);
          $('#feedback').className = 'feedback error';
          $('#feedback').textContent = '答错了，不过你有「二次挑战券」！再试一次，其他选项还能选。';
          return;
        }

        stage.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);
        stopPhaseTimer('✅');
        state.phase = 'answer-result';
        state.attempted += 1;
        if (isCorrect) {
          state.correct += 1;
          state.answerCorrect = true;
          const bonusCard = state.job.trait === 'extraCard' ? 1 : 0;
          state.drawChoices = (state.attempts === 1 ? 3 : 2) + bonusCard;
          playResult(true);
          $('#feedback').className = 'feedback success';
          $('#feedback').textContent = `答对了！${mathNumber(q.a)} ${q.op} ${operatorNumber(q.b)} = ${mathNumber(q.answer)}。${bonusCard ? `学生特权：多一张卡可以挑（共${state.drawChoices}张）。` : ''}接着选择卡牌类型。`;
          queueTransition(renderCategoryChoice, 1100);
        } else {
          state.answerCorrect = false;
          state.drawChoices = 1;
          playResult(false);
          $('#feedback').className = 'feedback error';
          $('#feedback').innerHTML = `正确答案是 ${mathNumber(q.answer)}，因为 ${mathNumber(q.a)} ${q.op} ${operatorNumber(q.b)} = ${mathNumber(q.answer)}。答错也能自己选牌类、自己翻牌，只是好牌率比较低。${numberLineHTML(q.answer)}`;
          queueTransition(renderCategoryChoice, 1800);
        }
      }

      function renderCategoryChoice() {
        state.phase = 'category-choice';
        const chance = boostedChance(state.answerCorrect ? .55 : .15);
        stage.innerHTML = `
          <div class="stage-kicker">${state.answerCorrect ? '🎯 答对奖励' : '🎴 答错也能选牌'}</div>
          <h2 class="stage-title">选择你想抽的卡牌类型</h2>
          <p class="stage-text"><span class="chance-badge">好牌率 ${Math.round(chance * 100)}%</span> 你会得到${state.drawChoices}张同类型卡，自己翻开后再选1张。</p>
          <div class="category-grid">${cardCategories.map(category => `
            <button class="category-btn" type="button" data-category="${category.name}">
              <span class="category-icon" aria-hidden="true">${category.icon}</span>
              <span><span class="category-name">${category.name}</span><span class="category-desc">${category.desc}</span></span>
            </button>`).join('')}</div>`;
        stage.querySelectorAll('.category-btn').forEach(button => button.addEventListener('click', () => {
          if (state.phase !== 'category-choice') return;
          state.selectedCategory = button.dataset.category;
          renderCards(state.drawChoices, state.selectedCategory, chance);
        }));
        startPhaseTimer('category-choice', categoryTimeout);
      }

      function drawWeightedCards(category, count, goodChance) {
        const pool = normalCards.filter(card => card.category === category);
        const good = shuffle(pool.filter(card => card.amount > 0));
        const bad = shuffle(pool.filter(card => card.amount < 0));
        const selected = [];
        for (let i = 0; i < count; i += 1) {
          const wantsGood = Math.random() < goodChance;
          const preferred = wantsGood ? good : bad;
          const fallback = wantsGood ? bad : good;
          selected.push((preferred.length ? preferred : fallback).shift());
        }
        return selected.map(scaleCard);
      }

      function scaleCard(card) {
        const factor = state.session >= 6 ? 1.5 : 1;
        const vendorBoost = state.job.trait === 'eventBoost' && card.category === '活动卡' ? 1.5 : 1;
        const size = Math.round(Math.abs(card.amount) * factor * vendorBoost);
        const amount = Math.sign(card.amount) * Math.min(15, Math.max(1, size));
        return { ...card, amount, boosted: vendorBoost > 1 };
      }

      function renderCards(count, category = null, goodChance = .50) {
        state.phase = 'cards';
        state.selectedCategory = category || pick(cardCategories).name;
        state.cards = drawWeightedCards(state.selectedCategory, count, goodChance);
        state.revealed = new Set();
        stage.innerHTML = `
          <div class="stage-kicker">🎴 ${state.selectedCategory}</div>
          <h2 class="stage-title">${count > 1 ? `先把${count}张卡全部翻开，再选1张` : '翻开这张卡，看看运气如何'}</h2>
          <p class="stage-text">本次好牌率 ${Math.round(goodChance * 100)}%。自己动手翻牌，卡片打开后才决定要哪一张。</p>
          <div class="card-grid">${state.cards.map((card, i) => `
            <button class="draw-card" type="button" data-index="${i}" aria-label="翻开第${i + 1}张卡">
              <span class="draw-card-inner">
                <span class="draw-face card-back"><span class="card-back-icon">❓</span><span class="card-back-text">点击翻卡</span></span>
                <span class="draw-face card-front ${card.tone}"><span class="card-category">${card.category}${card.boosted ? ' ×1.5' : ''}</span><span class="card-icon">${card.icon}</span><span class="card-title">${card.title}</span><span class="card-copy">${card.text}</span><span class="card-value">${signed(card.amount)}</span><span class="select-card" hidden>选择这张</span></span>
              </span>
            </button>`).join('')}</div>
          <div id="feedback" class="feedback">请先翻开所有卡片。</div>`;

        stage.querySelectorAll('.draw-card').forEach(btn => btn.addEventListener('click', () => handleCardClick(btn)));
        startPhaseTimer('cards', cardsTimeout);
      }

      function revealAndApplyCard(card) {
        if (state.phase !== 'cards') return;
        const index = state.cards.indexOf(card);
        const button = stage.querySelector(`.draw-card[data-index="${index}"]`);
        if (button && !state.revealed.has(index)) {
          state.revealed.add(index);
          button.classList.add('revealed', 'selected');
          button.setAttribute('aria-label', `${card.title}，${signed(card.amount)}`);
        }
        playFlip();
        const feedback = $('#feedback');
        if (feedback) feedback.textContent = `系统抽到了「${card.title}」：${signed(card.amount)}。先看清楚这张卡，再继续。`;
        queueTransition(() => applyNormalCard(card, true), 1300);
      }

      function handleCardClick(button) {
        const index = Number(button.dataset.index);
        if (!state.revealed.has(index)) {
          state.revealed.add(index);
          button.classList.add('revealed');
          button.setAttribute('aria-label', `${state.cards[index].title}，${signed(state.cards[index].amount)}`);
          playFlip();
          if (state.revealed.size === state.cards.length) {
            stage.querySelectorAll('.select-card').forEach(el => el.hidden = false);
            $('#feedback').textContent = '全部打开了！现在选择你想要的1张卡。';
          }
          return;
        }
        if (state.revealed.size < state.cards.length) {
          toast('要先把所有卡片翻开哦！');
          return;
        }
        applyNormalCard(state.cards[index], false, button);
      }

      function applyNormalCard(card, automatic = false, button = null) {
        if (state.phase !== 'cards') return;
        state.phase = 'applying';
        stopPhaseTimer('🎴');
        if (button) button.classList.add('selected');
        const before = state.money;
        state.money += card.amount;
        state.ledger.push({ label: `${automatic ? '系统抽卡：' : ''}${card.title}`, value: card.amount, equation: `${cash(before)} ${card.amount >= 0 ? '+' : '−'} ${Math.abs(card.amount)}金币 = ${cash(state.money)}` });
        updateHUD();
        flashDelta(card.amount);
        noteNegative(before, state.money);
        const guaranteedDecision = state.session % 2 === 1 && state.session >= 3;
        const scamMagnet = state.job.trait === 'scamMagnet';
        const decisionChance = guaranteedDecision ? 1 : (scamMagnet ? .40 : .20);
        queueTransition(() => {
          if (Math.random() < decisionChance) renderDecision();
          else finishSession();
        }, automatic ? 500 : 850);
      }

      function renderDecision() {
        state.phase = 'decision';
        const item = pick(decisionCards);
        state.currentDecision = item;
        playScamAlert();
        stage.innerHTML = `
          <div class="stage-kicker">🔍 突发情境</div>
          <h2 class="stage-title">这个机会值得相信吗？</h2>
          <p class="stage-text">仔细阅读资料，再作决定。这里不会提前告诉你是真是假。</p>
          <div class="decision-box">
            <div class="decision-icon">${item.icon}</div>
            <div>
              <h3 class="decision-title">${item.title}</h3>
              <p class="stage-text">${item.text}</p>
              ${state.activeEffects.scamTip ? `<p class="scam-hint">🔍 提示线索：${item.hint}</p>` : ''}
              <div class="decision-actions">
                <button class="choice-btn trust" type="button" data-choice="trust">相信并参加</button>
                <button class="choice-btn refuse" type="button" data-choice="refuse">拒绝，不参加</button>
              </div>
            </div>
          </div>`;
        stage.querySelectorAll('[data-choice]').forEach(btn => btn.addEventListener('click', () => resolveDecision(btn.dataset.choice)));
        startPhaseTimer('decision', decisionTimeout);
      }

      function resolveDecision(choice) {
        if (state.phase !== 'decision') return;
        state.phase = 'decision-result';
        stopPhaseTimer('🔍');
        const d = state.currentDecision;
        const trusted = choice === 'trust';
        let amount = trusted ? d.trust : d.refuse;
        const correctDecision = trusted === d.safe;
        if (!d.safe && !trusted) state.avoided += 1;
        let shieldUsed = false;
        if (trusted && !d.safe && amount < 0 && state.activeEffects.scamShield) {
          shieldUsed = true;
          state.activeEffects.scamShield = false;
          renderActiveEffects();
          amount = 0;
        }
        const before = state.money;
        state.money += amount;
        state.ledger.push({ label: `${d.title}：${trusted ? '相信' : '拒绝'}${shieldUsed ? '（防诈盾生效）' : ''}`, value: amount, equation: amount ? `${cash(before)} ${amount >= 0 ? '+' : '−'} ${Math.abs(amount)}金币 = ${cash(state.money)}` : '现金没有变化' });
        updateHUD();
        flashDelta(amount);
        noteNegative(before, state.money);
        if (!amount) playResult(correctDecision || shieldUsed);
        stage.innerHTML = `
          <div class="stage-kicker">${shieldUsed ? '🛡️ 防诈盾生效' : correctDecision ? '✅ 判断正确' : '💡 学到一招'}</div>
          <h2 class="stage-title">${shieldUsed ? '这次的损失被挡下来了！' : correctDecision ? '你的判断很不错！' : '下次先查证，再作决定。'}</h2>
          <div class="decision-box">
            <div class="decision-icon">${shieldUsed ? '🛡️' : correctDecision ? '🛡️' : '🔎'}</div>
            <div><h3 class="decision-title">${d.title}</h3><p class="stage-text">${d.reveal}</p><strong>${amount ? signed(amount) : '现金不变'}</strong></div>
          </div>`;
        queueTransition(finishSession, 2100);
      }

      function finishSession() {
        if (state.phase === 'report' || state.phase === 'end') return;
        stopPhaseTimer('📒');
        state.phase = 'report';
        const latePenalty = state.job.trait === 'lateShield' ? .25 : .5;
        const baseIncome = state.walkOnTime ? state.job.income : Math.round(state.job.income * (1 - latePenalty));
        const overtimeBonus = state.activeEffects.overtimePay ? 5 : 0;
        const totalIncome = baseIncome + overtimeBonus;
        const beforeIncome = state.money;
        state.money += totalIncome;
        const lateText = state.job.trait === 'lateShield' ? '迟到只扣25%' : '迟到减半';
        const incomeLabel = state.walkOnTime
          ? (overtimeBonus ? `${state.job.name}当日收入（含加班津贴）` : `${state.job.name}当日收入`)
          : `${state.job.name}当日收入（${lateText}${overtimeBonus ? '＋加班津贴' : ''}）`;
        state.ledger.push({ label: incomeLabel, value: totalIncome, equation: `${cash(beforeIncome)} + ${totalIncome}金币 = ${cash(state.money)}` });
        const beforeExpense = state.money;
        state.money -= state.job.expense;
        state.ledger.push({ label: `${state.job.name}固定开销`, value: -state.job.expense, equation: `${cash(beforeExpense)} − ${state.job.expense}金币 = ${cash(state.money)}` });
        if (state.activeEffects.safetyBox && state.money < 0) {
          const beforeSafety = state.money;
          state.money += 5;
          state.ledger.push({ label: '安全网道具生效', value: 5, equation: `${cash(beforeSafety)} + 5金币 = ${cash(state.money)}` });
        }
        if (state.activeEffects.incomeDouble) {
          const delta = state.money - state.sessionStartMoney;
          const beforeDouble = state.money;
          state.money += delta;
          state.ledger.push({ label: '收入加倍券生效（本轮盈亏 ×2）', value: delta, equation: `${cash(beforeDouble)} ${delta >= 0 ? '+' : '−'} ${Math.abs(delta)}金币 = ${cash(state.money)}` });
        }
        updateHUD();
        noteNegative(beforeExpense, state.money);
        renderReport();
      }

      function renderReport() {
        const change = state.money - state.sessionStartMoney;
        state.reportSeconds = REPORT_SECONDS;
        stage.innerHTML = `
          <div class="report-hero">
            <div class="report-icon">📒</div>
            <div><div class="stage-kicker">第${(state.session - 1) * 3 + 1}–${state.session * 3}天完成</div><h2 class="stage-title">这三天有赚钱吗？</h2><p class="stage-text">先看本轮盈亏，再看看每一笔收入和支出。</p></div>
          </div>
          <div class="session-outcome ${change < 0 ? 'loss' : ''}"><span>本轮盈亏</span><strong>${change === 0 ? '0金币 · 收支平衡' : `${signed(change)} · ${change > 0 ? '这三天有赚钱！' : '这三天亏钱了'}`}</strong></div>
          <div class="report-list">${state.ledger.map(item => `<div class="report-row"><span>${item.label}</span><span>${item.value === 0 ? '0金币' : signed(item.value)}</span><span class="report-row-equation">${item.equation}</span></div>`).join('')}</div>
          <div class="report-equation">总现金：${cash(state.sessionStartMoney)} ${change >= 0 ? '+' : '−'} ${Math.abs(change)}金币 = ${cash(state.money)}</div>
          ${state.money < 0 ? `<div class="negative-tip">📉 ${cash(state.money)} 是负数，表示你的支出比现金多 ${Math.abs(state.money)}金币。你没有出局，下一轮仍可赚钱翻身！</div>` : ''}
          <div class="report-next">
            <span class="auto-next">若没有操作，<strong id="reportCountdown">${REPORT_SECONDS}</strong>秒后自动进入三天后</span>
            <button id="nextSessionBtn" class="secondary-btn" type="button">进入三天后 →</button>
          </div>`;
        $('#nextSessionBtn').addEventListener('click', nextSession);
        clearInterval(state.reportTimerId);
        state.timer = state.reportSeconds;
        setTimerText();
        state.reportTimerId = setInterval(() => {
          state.reportSeconds -= 1;
          state.timer = Math.max(0, state.reportSeconds);
          setTimerText();
          const el = $('#reportCountdown');
          if (el) el.textContent = state.reportSeconds;
          if (state.reportSeconds <= 0) nextSession();
        }, 1000);
      }

      function nextSession() {
        if (state.phase !== 'report') return;
        clearInterval(state.reportTimerId);
        state.reportTimerId = null;
        if (state.session >= TOTAL_SESSIONS) {
          endGame();
          return;
        }
        renderShop();
      }

      function itemPrice(item) {
        return state.job.trait === 'discount' ? Math.max(1, Math.round(item.price * .8)) : item.price;
      }

      function renderShop() {
        state.phase = 'shop';
        state.activeEffects = { luckyCharm: false, retryTicket: false, safetyBox: false, overtimePay: false, scamTip: false, extraTime: false, carUpgrade: false, scamShield: false, incomeDouble: false };
        state.shopOpeningMoney = state.money;
        state.pendingLedger = [];
        state.wheelSpinning = false;
        stopPhaseTimer('🛒 停止计时');
        renderShopStage();
      }

      function renderShopStage() {
        const wheelUnlocked = state.session >= 5;
        const hasDiscount = state.job.trait === 'discount';
        stage.innerHTML = `
          <div class="stage-kicker">🛒 道具商店 · ⏸ 购物时间不计时</div>
          <h2 class="stage-title">要不要为下一轮添购道具？</h2>
          <p class="stage-text">现在手上有 ${cash(state.money)}。买东西时时间是停止的，可以慢慢想。${hasDiscount ? '实习生特权：所有道具已经打8折。' : ''}</p>
          <div class="shop-grid">${shopItems.map(item => {
            const owned = state.activeEffects[item.id];
            const price = itemPrice(item);
            const afford = state.money >= price;
            return `<div class="shop-item ${owned ? 'owned' : ''}">
              <span class="shop-icon" aria-hidden="true">${item.icon}</span>
              <div class="shop-info">
                <div class="shop-head"><strong class="shop-name">${item.name}</strong><span class="shop-tag">${item.tag}</span></div>
                <p class="shop-desc">${item.desc}</p>
                <button class="shop-buy" type="button" data-id="${item.id}" ${owned || !afford ? 'disabled' : ''}>${owned ? '已购买 ✓' : `买 ${cash(price)}${hasDiscount ? `（原价${item.price}）` : ''}`}</button>
              </div>
            </div>`;
          }).join('')}</div>
          <div id="feedback" class="feedback">道具只在下一轮生效，请按需购买。买好了再按下面的按钮。</div>
          <div class="report-next">
            <span class="auto-next">⏸ 购物不计时，慢慢挑</span>
            <button id="shopContinueBtn" class="secondary-btn" type="button">${wheelUnlocked ? '买好了，下一步 →' : '进入下一轮 →'}</button>
          </div>`;
        stage.querySelectorAll('.shop-buy').forEach(btn => btn.addEventListener('click', () => buyShopItem(btn.dataset.id)));
        $('#shopContinueBtn').addEventListener('click', () => (wheelUnlocked ? renderWheelPrompt() : proceedFromShop()));
      }

      function buyShopItem(id) {
        if (state.phase !== 'shop') return;
        const item = shopItems.find(i => i.id === id);
        if (!item || state.activeEffects[item.id]) return;
        const price = itemPrice(item);
        if (state.money < price) { toast('金币不够，买不起这个道具。'); return; }
        const before = state.money;
        state.money -= price;
        state.activeEffects[item.id] = true;
        state.pendingLedger.push({ label: `商店购买：${item.name}`, value: -price, equation: `${cash(before)} − ${price}金币 = ${cash(state.money)}` });
        updateHUD();
        flashDelta(-price);
        toast(`已购买「${item.name}」，下一轮生效！`);
        renderShopStage();
      }

      function renderWheelPrompt() {
        if (!['shop', 'shop-prompt'].includes(state.phase)) return;
        state.phase = 'shop-prompt';
        stopPhaseTimer('🎡 停止计时');
        stage.innerHTML = `
          <div class="stage-kicker">🎡 幸运轮盘</div>
          <h2 class="stage-title">你要抽奖吗？</h2>
          <p class="stage-text">转一次10金币，从小猪扑满里扣。金币不足或总金币是负数时不能玩，中奖效果立即生效。</p>
          <div class="decision-actions">
            <button class="choice-btn trust" type="button" id="wheelYesBtn">要抽奖 🎡</button>
            <button class="choice-btn refuse" type="button" id="wheelNoBtn">不要抽奖</button>
          </div>
          <div id="feedback" class="feedback">⏸ 这里不计时，想清楚再决定。</div>`;
        $('#wheelYesBtn').addEventListener('click', renderWheel);
        $('#wheelNoBtn').addEventListener('click', proceedFromShop);
      }

      function renderWheel() {
        if (state.phase !== 'shop-prompt') return;
        state.phase = 'wheel';
        renderWheelStage();
      }

      function renderWheelStage() {
        const wheelDisabled = state.money < 0 || state.money < 10 || state.wheelSpinning;
        const wheelDisableReason = state.money < 0 ? '总现金是负数，暂时不能玩轮盘。' : (state.money < 10 ? '现金不足10金币，无法转轮盘。' : '');
        stage.innerHTML = `
          <div class="stage-kicker">🎡 幸运轮盘</div>
          <h2 class="stage-title">转吧，看看手气如何！</h2>
          <p class="stage-text">10金币/次，可以连续转，钱不够或总现金是负数时就不能再玩了。</p>
          <div class="wheel-wrap">
            <div class="wheel-pointer" aria-hidden="true">▼</div>
            <div id="wheelDial" class="wheel-dial">${wheelSegments.map(seg => `<span class="wheel-slice-label" style="transform: rotate(${seg.angle}deg) translateY(var(--label-offset)) rotate(${-seg.angle}deg);"><span>${seg.icon}</span><span>${seg.wheelText || seg.label}</span></span>`).join('')}</div>
          </div>
          <button id="wheelSpinBtn" class="secondary-btn" type="button" ${wheelDisabled ? 'disabled' : ''}>转一次 10金币</button>
          ${wheelDisableReason ? `<p class="stage-text" style="margin-top:8px">${wheelDisableReason}</p>` : ''}
          <div id="wheelResult" class="wheel-result" hidden></div>
          <div class="report-next">
            <span class="auto-next">⏸ 抽奖不计时，转完再继续</span>
            <button id="shopContinueBtn" class="secondary-btn" type="button">进入下一轮 →</button>
          </div>`;
        const dial = $('#wheelDial');
        if (dial) { dial.style.transition = 'none'; dial.style.transform = `rotate(${state.wheelRotation % 360}deg)`; }
        const spinBtn = $('#wheelSpinBtn');
        if (spinBtn) spinBtn.addEventListener('click', spinWheel);
        $('#shopContinueBtn').addEventListener('click', proceedFromShop);
      }

      function spinWheel() {
        if (state.phase !== 'wheel' || state.wheelSpinning) return;
        if (state.money < 0) { toast('总现金是负数，暂时不能玩轮盘。'); return; }
        if (state.money < 10) { toast('现金不足10金币，无法转轮盘。'); return; }
        const before = state.money;
        state.money -= 10;
        state.pendingLedger.push({ label: '幸运轮盘费用', value: -10, equation: `${cash(before)} − 10金币 = ${cash(state.money)}` });
        updateHUD();
        flashDelta(-10);
        state.wheelSpinning = true;
        const spinBtn = $('#wheelSpinBtn');
        if (spinBtn) spinBtn.disabled = true;
        const chosen = pickWeighted(wheelSegments);
        const base = ((state.wheelRotation % 360) + 360) % 360;
        const targetOffset = (360 - chosen.angle) % 360;
        let delta = targetOffset - base;
        if (delta <= 0) delta += 360;
        const spins = (4 + Math.floor(Math.random() * 3)) * 360;
        state.wheelRotation += spins + delta;
        const dial = $('#wheelDial');
        const wrap = document.querySelector('.wheel-wrap');
        if (dial) {
          dial.style.transition = 'transform 3.2s cubic-bezier(.17,.67,.16,1.01)';
          dial.style.transform = `rotate(${state.wheelRotation}deg)`;
        }
        if (wrap) wrap.classList.add('spinning');
        const resultBox = $('#wheelResult');
        if (resultBox) { resultBox.hidden = true; resultBox.className = 'wheel-result'; }
        playWheelTicks(3200);
        queueTransition(() => applyWheelPrize(chosen), 3200, 'wheel');
      }

      function applyWheelPrize(seg) {
        state.wheelSpinning = false;
        const wrap = document.querySelector('.wheel-wrap');
        if (wrap) wrap.classList.remove('spinning');
        const isBigWin = (seg.cash || 0) >= 20 || Boolean(seg.grantEffect);
        const isLoss = (seg.cash || 0) < 0;
        const resultBox = $('#wheelResult');
        if (resultBox) {
          resultBox.hidden = false;
          resultBox.className = `wheel-result show ${isLoss ? 'loss' : isBigWin ? 'jackpot' : 'win'}`;
          resultBox.innerHTML = `<span class="wheel-result-icon">${seg.icon}</span><strong>${seg.label}</strong><span>${seg.grantEffect ? '免费道具，下一轮生效！' : seg.cash ? signed(seg.cash) : '这次没中奖，再试一次？'}</span>`;
        }
        if (typeof seg.cash === 'number' && seg.cash !== 0) {
          const before = state.money;
          state.money += seg.cash;
          state.pendingLedger.push({ label: `幸运轮盘：${seg.label}`, value: seg.cash, equation: `${cash(before)} ${seg.cash >= 0 ? '+' : '−'} ${Math.abs(seg.cash)}金币 = ${cash(state.money)}` });
          updateHUD();
          flashDelta(seg.cash);
        }
        if (seg.grantEffect) {
          state.activeEffects[seg.grantEffect] = true;
          state.pendingLedger.push({ label: `幸运轮盘：${seg.label}`, value: 0, equation: '获得免费道具，现金不变' });
        }
        if (isBigWin) playFanfare();
        else if (!seg.cash) playResult(false);
        toast(`轮盘结果：${seg.label}${seg.grantEffect ? '，下一轮生效！' : ''}`);
        const spinBtn = $('#wheelSpinBtn');
        if (spinBtn) spinBtn.disabled = state.money < 10;
        updateHUD();
      }

      function proceedFromShop() {
        if (!['shop', 'shop-prompt', 'wheel'].includes(state.phase)) return;
        if (state.wheelSpinning) { toast('轮盘还在转动，等结果出来再继续吧！'); return; }
        state.session += 1;
        beginSession();
      }

      function renderJobReveal() {
        state.phase = 'job-reveal';
        clearInterval(state.timerId);
        state.timerId = null;
        updateHUD();
        $('#timer').textContent = '准备！';
        $('#timer').classList.remove('warning');
        const avatarHTML = state.job.photo
          ? `<div class="job-reveal-avatar"><img class="job-reveal-photo" src="${state.job.photo}" alt="${state.job.name}职业插画"><span class="job-reveal-icon-badge">${state.job.icon}</span></div>`
          : `<div class="job-reveal-icon" aria-hidden="true">${state.job.icon}</div>`;
        stage.innerHTML = `
          <div class="job-reveal">
            <div>
              <div class="stage-kicker">🎲 第一天 · 随机抽职业</div>
              ${avatarHTML}
              <h2 class="stage-title">你抽到了：${state.job.name}</h2>
              <p class="stage-text">${state.job.desc}</p>
              <p class="job-income">${state.job.perk}</p>
              <p class="job-trait good">👍 好处：${state.job.good}</p>
              <p class="job-trait bad">👎 坏处：${state.job.bad}</p>
              <button id="beginSessionBtn" class="secondary-btn" type="button">开始第1–3天 →</button>
            </div>
          </div>`;
        const begin = () => {
          if (state.phase !== 'job-reveal') return;
          clearTimeout(state.transitionTimerId);
          state.transitionTimerId = null;
          beginSession();
        };
        $('#beginSessionBtn').addEventListener('click', begin);
        queueTransition(begin, 6000, 'job-reveal');
      }

      function renderActiveEffects() {
        const active = shopItems.filter(item => state.activeEffects[item.id]);
        const card = $('#effectsCard');
        const list = $('#effectsList');
        if (!active.length) { card.hidden = true; list.innerHTML = ''; return; }
        card.hidden = false;
        list.innerHTML = active.map(item => `<span class="effect-chip" title="${item.desc}">${item.icon} ${item.name}</span>`).join('');
      }

      function walkAvatarHTML() {
        return state.job.photo
          ? `<img src="${state.job.photo}" alt="${state.job.name}">`
          : `<span class="walk-avatar-icon">${state.job.icon}</span>`;
      }

      function walkPositionPercent(position) {
        return `${((position + 10.5) / 21) * 100}%`;
      }

      function renderWalk() {
        state.phase = 'walk';
        if (state.activeEffects.carUpgrade) {
          state.walkOnTime = true;
          state.activeEffects.carUpgrade = false;
          renderActiveEffects();
          stopPhaseTimer('🚗');
          state.ledger.push({ label: '座驾升级：直接开车上班', value: 0, equation: '免走数字线，直接领全额收入' });
          playFanfare();
          stage.innerHTML = `
            <div class="stage-kicker">🚗 走路去工作</div>
            <h2 class="stage-title">今天开车上班，准时又轻松！</h2>
            <p class="stage-text">你买了座驾道具，免走数字线，直接准时到班，领取当日全额收入。</p>`;
          queueTransition(renderQuestion, 1400, 'walk');
          return;
        }
        const range = state.job.trait === 'shortWalk' ? 3 : 5;
        state.walkSteps = [randomStep(range), randomStep(range)];
        state.walkTarget = state.walkSteps[0] + state.walkSteps[1];
        state.walkPosition = 0;
        renderWalkStage();
        startPhaseTimer('walk', walkTimeout);
      }

      function renderWalkStage() {
        const [step1, step2] = state.walkSteps;
        const latePenalty = state.job.trait === 'lateShield' ? '只扣25%（摩托车代步）' : '减半';
        const shortNote = state.job.trait === 'shortWalk' ? '（店员路程短，只走 −3～3 步）' : '';
        const ticks = [];
        for (let i = -10; i <= 10; i += 1) ticks.push(`<span class="walk-tick ${i === 0 ? 'zero' : ''}">${mathNumber(i)}</span>`);
        stage.innerHTML = `
          <div class="stage-kicker">🚶 走路去工作</div>
          <h2 class="stage-title">用左右箭头，把${state.job.name}走到正确的位置！</h2>
          <p class="stage-text">起点是 0，今天要走两段路：先 <strong>${walkStepLabel(step1)}</strong>，再 <strong>${walkStepLabel(step2)}</strong>${shortNote}。左边是负数，右边是正数——走到你认为对的位置，再按「到了，打卡上班」。走对了准时领全额收入，走错了算迟到，收入${latePenalty}！</p>
          <div class="walk-line-wrap">
            <div class="walk-avatar-track"><div id="walkAvatarToken" class="walk-avatar-token" style="left:${walkPositionPercent(state.walkPosition)}">${walkAvatarHTML()}</div></div>
            <div class="walk-ticks">${ticks.join('')}</div>
          </div>
          <div class="walk-controls">
            <button id="walkLeftBtn" class="secondary-btn walk-arrow-btn" type="button">◀ 左（−1）</button>
            <span class="walk-position-readout">现在位置：<span id="walkPositionText">${mathNumber(state.walkPosition)}</span></span>
            <button id="walkRightBtn" class="secondary-btn walk-arrow-btn" type="button">右（+1）▶</button>
          </div>
          <div class="walk-controls">
            <button id="walkResetBtn" class="choice-btn" type="button">回到起点 0</button>
            <button id="walkConfirmBtn" class="primary-btn walk-confirm-btn" type="button" style="grid-column:auto">到了，打卡上班 ✅</button>
          </div>
          <div id="feedback" class="feedback">起点是 0，先算一算两步之后会在哪里，再用箭头走过去。</div>`;
        $('#walkLeftBtn').addEventListener('click', () => moveWalk(-1));
        $('#walkRightBtn').addEventListener('click', () => moveWalk(1));
        $('#walkResetBtn').addEventListener('click', () => moveWalk(0, true));
        $('#walkConfirmBtn').addEventListener('click', confirmWalk);
      }

      function moveWalk(delta, resetToZero = false) {
        if (state.phase !== 'walk') return;
        const previous = state.walkPosition;
        state.walkPosition = resetToZero ? 0 : Math.max(-10, Math.min(10, state.walkPosition + delta));
        const token = $('#walkAvatarToken');
        if (token) {
          token.style.left = walkPositionPercent(state.walkPosition);
          token.classList.toggle('facing-left', state.walkPosition < previous);
          token.classList.remove('stepping');
          void token.offsetWidth;
          token.classList.add('stepping');
        }
        const posText = $('#walkPositionText');
        if (posText) posText.textContent = mathNumber(state.walkPosition);
        if (state.walkPosition !== previous || resetToZero) playStep(state.walkPosition - previous);
      }

      function confirmWalk() {
        if (state.phase !== 'walk') return;
        state.phase = 'walk-result';
        stopPhaseTimer(state.walkPosition === state.walkTarget ? '✅' : '⏰');
        const onTime = state.walkPosition === state.walkTarget;
        state.walkOnTime = onTime;
        const [step1, step2] = state.walkSteps;
        const lateText = state.job.trait === 'lateShield' ? '只扣25%' : '减半';
        state.ledger.push({ label: onTime ? '走路去工作：准时打卡' : '走路去工作：迟到了', value: 0, equation: `0 + ${operatorNumber(step1)} + ${operatorNumber(step2)} = ${mathNumber(state.walkTarget)}` });
        if (onTime) playFanfare();
        else playResult(false);
        ['walkLeftBtn', 'walkRightBtn', 'walkResetBtn', 'walkConfirmBtn'].forEach(id => { const el = $(`#${id}`); if (el) el.disabled = true; });
        $('#feedback').className = `feedback ${onTime ? 'success' : 'error'}`;
        $('#feedback').innerHTML = onTime
          ? `准时打卡！0 + ${operatorNumber(step1)} + ${operatorNumber(step2)} = ${mathNumber(state.walkTarget)}，算对了，今天领全额收入。`
          : `你停在了 ${mathNumber(state.walkPosition)}，但正确位置是 0 + ${operatorNumber(step1)} + ${operatorNumber(step2)} = ${mathNumber(state.walkTarget)}。你迟到了，今天收入${lateText}。${numberLineHTML(state.walkTarget)}`;
        queueTransition(renderQuestion, 2200, 'walk-result');
      }

      function beginSession() {
        clearTimeout(state.transitionTimerId);
        state.transitionTimerId = null;
        state.sessionStartMoney = state.pendingLedger.length ? state.shopOpeningMoney : state.money;
        state.ledger = state.pendingLedger.length ? [...state.pendingLedger] : [];
        state.pendingLedger = [];
        state.drawChoices = 1;
        state.answerCorrect = false;
        state.selectedCategory = null;
        state.walkOnTime = true;
        updateHUD();
        renderActiveEffects();
        renderWalk();
      }

      function titleForMoney(money) {
        if (money >= 35) return { icon: '🐉', title: '咸鱼变锦鲤', note: `从 −5 金币一路翻到 ${cash(money)}，数学和判断力都很到位！` };
        if (money >= 20) return { icon: '🏆', title: '翻身成功', note: '你不但还清了欠款，还赚了一笔，咸鱼正式翻身！' };
        if (money >= 0) return { icon: '🌱', title: '刚好上岸', note: '从负数爬回正数已经很不容易，下一局试试冲更高！' };
        return { icon: '🐟', title: '还是咸鱼（但更懂负数了）', note: '虽然还是负数，但你已经看懂欠款怎么算。再来一局，一定能翻身！' };
      }

      function endGame() {
        state.phase = 'end';
        clearInterval(state.timerId);
        clearInterval(state.reportTimerId);
        clearTimeout(state.transitionTimerId);
        state.transitionTimerId = null;
        stopMusic();
        const result = titleForMoney(state.money);
        const accuracy = state.attempted ? Math.round(state.correct / state.attempted * 100) : 0;
        showScreen('endScreen');
        $('#endContent').innerHTML = `
          <div class="trophy" aria-hidden="true">${result.icon}</div>
          <p class="eyebrow" style="margin-inline:auto">30天翻身挑战完成</p>
          <h1 id="endTitle" class="end-title">${result.title}</h1>
          <p class="end-subtitle">${state.player} · ${state.job.icon} ${state.job.name}</p>
          <div class="end-money ${state.money < 0 ? 'money negative' : ''}">${cash(state.money)}</div>
          <div class="summary-grid">
            <div class="summary-item"><span>完成天数</span><strong>30天</strong></div>
            <div class="summary-item"><span>答题正确率</span><strong>${accuracy}%</strong></div>
            <div class="summary-item"><span>未作答</span><strong>${state.unanswered}题</strong></div>
            <div class="summary-item"><span>避开风险</span><strong>${state.avoided}次</strong></div>
          </div>
          <p class="end-note">${result.note}</p>
          <div class="end-actions"><button id="restartBtn" class="primary-btn" type="button">再创业一次</button></div>`;
        $('#restartBtn').addEventListener('click', resetGame);
        playResult(true);
      }

      function resetGame() {
        clearInterval(state.timerId);
        clearInterval(state.reportTimerId);
        clearTimeout(state.transitionTimerId);
        stopMusic();
        Object.assign(state, {
          player: '', date: '', money: START_MONEY, session: 1, job: null, correct: 0,
          attempted: 0, unanswered: 0, avoided: 0, phase: 'idle', attempts: 0,
          question: null, cards: [], revealed: new Set(), timer: 0,
          timerId: null, reportTimerId: null, transitionTimerId: null, reportSeconds: REPORT_SECONDS,
          sessionStartMoney: START_MONEY, ledger: [],
          drawChoices: 1,
          answerCorrect: false, selectedCategory: null,
          activeEffects: { luckyCharm: false, retryTicket: false, safetyBox: false, overtimePay: false, scamTip: false, extraTime: false, carUpgrade: false, scamShield: false, incomeDouble: false },
          shopOpeningMoney: START_MONEY, pendingLedger: [],
          walkSteps: [0, 0], walkTarget: 0, walkPosition: 0, walkOnTime: true,
          wheelRotation: 0, wheelSpinning: false
        });
        $('#effectsCard').hidden = true;
        $('#startForm').reset();
        $('#playDate').value = todayLocal();
        showScreen('startScreen');
        $('#playerName').focus();
      }

      $('#startForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const name = $('#playerName').value.trim();
        if (!name) return;
        state.player = name;
        state.date = $('#playDate').value;
        state.job = pick(jobs);
        state.money = START_MONEY;
        $('#jobIcon').textContent = state.job.icon;
        const jobPhotoEl = $('#jobPhoto');
        if (state.job.photo) {
          jobPhotoEl.src = state.job.photo;
          jobPhotoEl.alt = `${state.job.name}职业插画`;
          jobPhotoEl.hidden = false;
        } else {
          jobPhotoEl.hidden = true;
          jobPhotoEl.removeAttribute('src');
        }
        $('#jobName').textContent = state.job.name;
        $('#jobDesc').textContent = state.job.desc;
        $('#jobIncome').textContent = state.job.perk;
        $('#jobGood').textContent = `👍 ${state.job.good}`;
        $('#jobBad').textContent = `👎 ${state.job.bad}`;
        ensureAudio();
        beginMusic();
        showScreen('gameScreen');
        renderJobReveal();
      });

      $('#soundBtn').addEventListener('click', () => {
        state.sound = !state.sound;
        $('#soundBtn').textContent = state.sound ? '🔊' : '🔇';
        $('#soundBtn').setAttribute('aria-label', state.sound ? '关闭声音' : '开启声音');
        $('#soundBtn').title = state.sound ? '关闭声音' : '开启声音';
        if (state.sound) { ensureAudio(); beginMusic(); beep(523, .12); }
        else stopMusic();
      });

      $('#playDate').value = todayLocal();
    })();
  </script>
</body>
</html>
