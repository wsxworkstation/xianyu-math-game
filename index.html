        dneg: { g: ['.....','.....','.....','aaaaa','.....','.....','.....'], p: { a:'#ffe873' } }
      };

      function pixelSprite(key, cls) {
        const sp = SPRITES[key];
        if (!sp) return '';
        const h = sp.g.length, w = sp.g[0].length;
        let rects = '';
        for (let y = 0; y < h; y += 1) {
          let x = 0;
          while (x < w) {
            const ch = sp.g[y][x];
            if (ch === '.') { x += 1; continue; }
            let run = 1;
            while (x + run < w && sp.g[y][x + run] === ch) run += 1;
            rects += `<rect x="${x}" y="${y}" width="${run}" height="1" fill="${sp.p[ch]}"/>`;
            x += run;
          }
        }
        return `<svg class="${cls || 'sprite'}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
      }

      /* ================= 🎣 钓号码：8-bit 抽号机，算负数总和 ================= */

      const FISH_CASTS = 3;

      function pixelNumber(value, cls) {
        return String(value)
          .replace('-', '−')
          .split('')
          .map(ch => pixelSprite(ch === '−' ? 'dneg' : 'd' + ch, cls || 'sprite digit-sprite'))
          .join('');
      }

      function renderFishing() {
        state.phase = 'fishing';
        state.fishNumbers = [];
        state.fishCastsLeft = FISH_CASTS;
        state.fishCasting = false;
        state.reelValue = -0;
        renderFishingStage();
        startPhaseTimer('fishing', fishingTimeout);
      }

      function fishingTotal() {
        return state.fishNumbers.reduce((sum, n) => sum + n, 0);
      }

      function renderFishingStage() {
        const left = state.fishCastsLeft;
        stage.innerHTML = `
          <div class="stage-kicker">🎣 休息一下 · 钓号码</div>
          <h2 class="stage-title">拉杆 ${FISH_CASTS} 次，钓起三个负数！</h2>
          <p class="stage-text">号码机会一直转，停下来的都是负数。三个钓完，要自己算出加起来是多少——<strong>算对拿 5 金币，算错要赔钱</strong>。号码本身不进钱包，只是给你算的。</p>
          <div class="reel-machine">
            <div class="reel-head">8-BIT 号码机</div>
            <div class="reel-window ${state.fishCasting ? 'spinning' : ''}" id="reelWindow">
              ${state.fishCasting
                ? pixelNumber(state.reelValue)
                : state.fishNumbers.length
                  ? pixelSprite(state.lastFishKey || 'minnow', 'sprite reel-fish') + pixelNumber(state.fishNumbers[state.fishNumbers.length - 1])
                  : '<span class="reel-idle">- -</span>'}
            </div>
            <div class="reel-bulbs">${[0, 1, 2].map(i => `<span class="reel-bulb ${i < state.fishNumbers.length ? 'lit' : ''}"></span>`).join('')}</div>
          </div>
          <div class="basket-row">${state.fishNumbers.map(n => `
            <div class="caught-num">${pixelNumber(n, 'sprite digit-sprite small')}</div>`).join('') || '<span class="basket-empty">还没钓到号码</span>'}</div>
          <p class="mini-score">目前的算式：<strong>${state.fishNumbers.length ? state.fishNumbers.map(operatorNumber).join(' + ') : '—'}</strong></p>
          <div class="net-row">
            <button id="castBtn" class="primary-btn" type="button" style="grid-column:auto; min-width:220px" ${left <= 0 || state.fishCasting ? 'disabled' : ''}>
              ${state.fishCasting ? '号码转动中…' : `🎣 拉杆（还有 ${left} 次）`}
            </button>
          </div>
          <div id="feedback" class="feedback">${left > 0 ? '按「拉杆」启动号码机。' : '三个号码到齐了，来算总和。'}</div>`;
        const btn = $('#castBtn');
        if (btn) btn.addEventListener('click', castRod);
      }

      function castRod() {
        if (state.phase !== 'fishing' || state.fishCasting || state.fishCastsLeft <= 0) return;
        state.fishCasting = true;
        const finalValue = -(1 + Math.floor(Math.random() * 9));
        renderFishingStage();
        let ticks = 0;
        const totalTicks = 24;
        const spin = () => {
          if (state.phase !== 'fishing') return;
          ticks += 1;
          const done = ticks >= totalTicks;
          state.reelValue = done ? finalValue : -(1 + Math.floor(Math.random() * 9));
          const win = $('#reelWindow');
          if (win) win.innerHTML = pixelNumber(state.reelValue);
          tone(done ? 880 : 520 + (ticks % 4) * 60, 0, .04, 'square', .028);
          if (done) { settleCatch(finalValue); return; }
          const t = ticks / totalTicks;
          state.reelTimer = setTimeout(spin, 45 + t * t * t * 340);
        };
        spin();
      }

      const FISH_KEYS = ['minnow', 'salted', 'grouper', 'golden', 'boot'];

      function settleCatch(value) {
        state.lastFishKey = FISH_KEYS[Math.floor(Math.random() * FISH_KEYS.length)];
        state.fishNumbers.push(value);
        state.fishCastsLeft -= 1;
        state.fishCasting = false;
        playCoin();
        renderFishingStage();
        const fb = $('#feedback');
        if (fb) {
          fb.className = 'feedback';
          fb.innerHTML = `钓到号码 <strong>${mathNumber(value)}</strong>。${state.fishCastsLeft > 0 ? `还有 ${state.fishCastsLeft} 次。` : '三个到齐了！'}`;
        }
        if (state.fishCastsLeft <= 0) queueTransition(askFishingTotal, 1400, 'fishing');
      }

      function askFishingTotal() {
        if (state.phase !== 'fishing') return;
        state.phase = 'fishing-sum';
        stopPhaseTimer('🧮');
        const total = fishingTotal();
        const opts = new Set([total]);
        for (const dlt of shuffle([1, -1, 2, -2, 3, -3, 4, 5])) { if (opts.size >= 4) break; opts.add(total + dlt); }
        stage.innerHTML = `
          <div class="stage-kicker">🧮 算一算 · 三个负数加起来</div>
          <h2 class="stage-title">这三个号码加起来是多少？</h2>
          <div class="basket-row">${state.fishNumbers.map(n => `
            <div class="caught-num">${pixelNumber(n, 'sprite digit-sprite small')}</div>`).join('')}</div>
          <div class="question-box">
            <p class="equation">${state.fishNumbers.map(operatorNumber).join(' + ')} = ?</p>
            <div class="answers">${shuffle([...opts]).map(v => `<button class="answer-btn" type="button" data-v="${v}">${mathNumber(v)}</button>`).join('')}</div>
          </div>
          <div id="feedback" class="feedback">算对拿 5 金币；算错要随机赔钱（最多赔 ${Math.max(3, 15 - state.luckLevel * 2)} 金币，幸运值越高赔越少）。</div>`;
        stage.querySelectorAll('.answer-btn').forEach(b => b.addEventListener('click', () => answerFishingTotal(Number(b.dataset.v), b)));
        startPhaseTimer('fishing', () => answerFishingTotal(null, null));
      }

      function answerFishingTotal(value, button) {
        if (state.phase !== 'fishing-sum') return;
        state.phase = 'fishing-result';
        stopPhaseTimer('🎣');
        const total = fishingTotal();
        const correct = value === total;
        stage.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);
        if (button) button.classList.add(correct ? 'correct' : 'wrong');
        const maxPenalty = Math.max(3, 15 - state.luckLevel * 2);
        const penalty = -(1 + Math.floor(Math.random() * maxPenalty));
        if (correct) { awardMiniGame(5, '钓号码：算对奖金'); playFanfare(); }
        else { awardMiniGame(penalty, '钓号码：算错赔钱'); playLoss(); }
        const fb = $('#feedback');
        if (fb) {
          fb.className = `feedback ${correct ? 'success' : 'error'}`;
          fb.innerHTML = correct
            ? `算对了！${state.fishNumbers.map(operatorNumber).join(' + ')} = ${mathNumber(total)}，拿到 5金币。`
            : `正确答案是 ${mathNumber(total)}：${state.fishNumbers.map(operatorNumber).join(' + ')} = ${mathNumber(total)}。这次赔了 ${Math.abs(penalty)}金币。${numberLineHTML(total)}`;
        }
        queueTransition(leaveMiniGame, 3800, 'fishing-result');
      }

      function fishingTimeout() {
        if (state.phase !== 'fishing') return;
        toast('时间到！');
        if (state.fishNumbers.length) { askFishingTotal(); return; }
        state.phase = 'fishing-result';
        stopPhaseTimer('⏰');
        leaveMiniGame();
      }

      /* ================= 🍉 水果忍者：五场，每场目标不同 ================= */

      const FRUIT_KEYS = ['melon', 'apple', 'orange', 'banana', 'berry'];
      const NINJA_ROUNDS = 5;
      const NINJA_ROUND_MS = 9000;

      function makeNinjaEquation(wantAnswer, targetAnswer) {
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        let answer = targetAnswer;
        if (!wantAnswer) {
          do { answer = targetAnswer + (Math.random() < .5 ? -1 : 1) * rand(1, 5); } while (answer === targetAnswer);
        }
        const b = rand(1, 9);
        if (Math.random() < .5) return { text: `${mathNumber(answer - b)} + ${b}`, answer };
        return { text: `${mathNumber(answer + b)} − ${b}`, answer };
      }

      function renderNinja() {
        state.phase = 'ninja';
        state.ninjaRound = 0;
        state.ninjaEarned = 0;
        state.ninjaHits = 0;
        state.ninjaMiss = 0;
        state.ninjaTargets = [];
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const span = state.session >= 5 ? 9 : 6;
        while (state.ninjaTargets.length < NINJA_ROUNDS) {
          const t = (Math.random() < .55 ? -1 : 1) * rand(1, span);
          if (!state.ninjaTargets.includes(t)) state.ninjaTargets.push(t);
        }
        stage.innerHTML = `
          <div class="stage-kicker">🍉 休息一下 · 水果忍者</div>
          <h2 class="stage-title">五场挑战，每场要切的答案都不同！</h2>
          <p class="stage-text">算式会飞上来，点一下就是切。切对 +2金币，切错 −1金币。每场 9 秒，看清楚目标再下手。</p>
          <div class="ninja-head">
            <div class="mini-target"><span id="ninjaRoundLabel">第 1 / ${NINJA_ROUNDS} 场 · 只切答案 =</span><strong id="ninjaTargetLabel">?</strong></div>
            <div class="ninja-pips" id="ninjaPips"></div>
          </div>
          <div id="ninjaField" class="ninja-field"></div>
          <p class="mini-score">切对 <strong id="ninjaHits">0</strong>　切错 <strong id="ninjaMiss">0</strong>　本关赚 <strong id="ninjaEarned">0金币</strong></p>
          <div class="net-row"><button id="ninjaSkipBtn" class="choice-btn" type="button">不玩了，提前收手</button></div>
          <div id="feedback" class="feedback">准备好了吗？第一场马上开始。</div>`;
        $('#ninjaSkipBtn').addEventListener('click', () => finishNinja(true));
        startPhaseTimer('ninja', () => finishNinja(false));
        startNinjaRound();
      }

      function startNinjaRound() {
        if (state.phase !== 'ninja') return;
        state.ninjaRound += 1;
        if (state.ninjaRound > NINJA_ROUNDS) { finishNinja(false); return; }
        state.ninjaTarget = state.ninjaTargets[state.ninjaRound - 1];
        const label = $('#ninjaRoundLabel');
        const target = $('#ninjaTargetLabel');
        if (label) label.textContent = `第 ${state.ninjaRound} / ${NINJA_ROUNDS} 场 · 只切答案 =`;
        if (target) target.textContent = mathNumber(state.ninjaTarget);
        const pips = $('#ninjaPips');
        if (pips) pips.innerHTML = state.ninjaTargets.map((t, i) => `<span class="ninja-pip ${i + 1 < state.ninjaRound ? 'done' : i + 1 === state.ninjaRound ? 'now' : ''}">${i + 1 < state.ninjaRound ? mathNumber(t) : '?'}</span>`).join('');
        const field = $('#ninjaField');
        if (field) field.innerHTML = '';
        tone(660, 0, .12, 'triangle', .04, 990);
        clearInterval(state.ninjaSpawnId);
        state.ninjaSpawnId = setInterval(spawnFruit, 1150);
        spawnFruit();
        clearTimeout(state.ninjaRoundId);
        state.ninjaRoundId = setTimeout(() => {
          clearInterval(state.ninjaSpawnId);
          state.ninjaSpawnId = null;
          startNinjaRound();
        }, NINJA_ROUND_MS);
      }

      function spawnFruit() {
        if (state.phase !== 'ninja') return;
        const field = $('#ninjaField');
        if (!field) return;
        const good = Math.random() < Math.min(.72, .38 + luckBonus());
        const eq = makeNinjaEquation(good, state.ninjaTarget);
        const key = FRUIT_KEYS[Math.floor(Math.random() * FRUIT_KEYS.length)];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'fruit';
        btn.dataset.answer = String(eq.answer);
        btn.innerHTML = `${pixelSprite(key, 'sprite fruit-sprite')}<span class="fruit-eq">${eq.text}</span>`;
        const leftPct = 6 + Math.random() * 74;
        const rise = Math.round(190 + Math.random() * 110);
        const dur = (4.2 + Math.random() * 1.2).toFixed(2);
        btn.style.left = `${leftPct}%`;
        btn.style.setProperty('--rise', `${rise}px`);
        btn.style.setProperty('--dur', `${dur}s`);
        btn.addEventListener('animationend', () => { if (!btn.classList.contains('sliced')) btn.remove(); });
        btn.addEventListener('click', () => sliceFruit(btn));
        field.appendChild(btn);
        setTimeout(() => btn.remove(), Number(dur) * 1000 + 400);
      }

      function sliceFruit(btn) {
        if (state.phase !== 'ninja' || btn.classList.contains('sliced')) return;
        const correct = Number(btn.dataset.answer) === state.ninjaTarget;
        const delta = correct ? 2 : -1;
        state.ninjaEarned += delta;
        if (correct) { state.ninjaHits += 1; noiseBurst(0, .1, .05, 3000); tone(880, 0, .12, 'triangle', .045, 1400); }
        else { state.ninjaMiss += 1; tone(200, 0, .2, 'sawtooth', .04, 120); }
        btn.classList.add('sliced');
        const pop = document.createElement('span');
        pop.className = 'slice-pop';
        pop.textContent = correct ? '+2' : '−1';
        pop.style.color = correct ? '#7cf7c4' : '#ff9a9a';
        pop.style.left = btn.style.left;
        pop.style.bottom = '42%';
        const field = $('#ninjaField');
        if (field) { field.appendChild(pop); setTimeout(() => pop.remove(), 700); }
        setTimeout(() => btn.remove(), 320);
        const h = $('#ninjaHits'), m = $('#ninjaMiss'), e = $('#ninjaEarned');
        if (h) h.textContent = state.ninjaHits;
        if (m) m.textContent = state.ninjaMiss;
        if (e) e.textContent = cash(state.ninjaEarned);
      }

      function finishNinja(early) {
        if (state.phase !== 'ninja') return;
        state.phase = 'ninja-result';
        clearInterval(state.ninjaSpawnId);
        state.ninjaSpawnId = null;
        clearTimeout(state.ninjaRoundId);
        state.ninjaRoundId = null;
        stopPhaseTimer('🍉');
        const field = $('#ninjaField');
        if (field) field.innerHTML = '';
        const earned = state.ninjaEarned;
        if (earned > 0) { playFanfare(); awardMiniGame(earned, '水果忍者奖金'); }
        else if (earned < 0) { playResult(false); awardMiniGame(earned, '水果忍者：切错扣钱'); }
        else playResult(false);
        const fb = $('#feedback');
        if (fb) {
          fb.className = `feedback ${earned > 0 ? 'success' : earned < 0 ? 'error' : ''}`;
          fb.textContent = earned > 0
            ? `${early ? '提前收手，' : '五场结束！'}切对${state.ninjaHits}个、切错${state.ninjaMiss}个，赚到 ${cash(earned)}。`
            : earned < 0
              ? `切错太多了：切对${state.ninjaHits}个、切错${state.ninjaMiss}个，倒扣 ${cash(Math.abs(earned))}。下次看清楚目标再切。`
              : '这次没切中任何水果，没赚也没亏。';
        }
        const skip = $('#ninjaSkipBtn');
        if (skip) { skip.textContent = '去商店 →'; skip.onclick = leaveMiniGame; }
        queueTransition(leaveMiniGame, 3500, 'ninja-result');
      }

      function leaveMiniGame() {
        if (!['fishing', 'fishing-sum', 'fishing-result', 'ninja', 'ninja-result'].includes(state.phase)) return;
        clearTimeout(state.reelTimer);
        state.reelTimer = null;
        clearInterval(state.ninjaSpawnId);
        state.ninjaSpawnId = null;
        clearTimeout(state.ninjaRoundId);
        state.ninjaRoundId = null;
        clearTimeout(state.transitionTimerId);
        state.transitionTimerId = null;
        stopPhaseTimer('🛒');
        renderShop();
      }

      function itemPrice(item) {
        return state.job.trait === 'discount' ? Math.max(1, Math.round(item.price * .8)) : item.price;
      }

      function renderShop() {
        state.phase = 'shop';
        state.wheelSpinning = false;
        stopPhaseTimer('🛒 停止计时');
        renderShopStage();
      }

      function renderShopStage() {
        const wheelUnlocked = state.session >= 3;
        const hasDiscount = state.job.trait === 'discount';
        stage.innerHTML = `
          <div class="stage-kicker">🛒 道具商店 · ⏸ 购物时间不计时</div>
          <h2 class="stage-title">要不要为下一轮添购道具？</h2>
          <p class="stage-text">现在手上有 ${cash(state.money)}。买东西时时间是停止的，可以慢慢想。${hasDiscount ? '实习生特权：所有道具已经打8折。' : ''}</p>
          <div class="shop-grid">${shopItems.map(item => {
            const owned = !item.repeat && state.activeEffects[item.id];
            const price = itemPrice(item);
            const afford = state.money >= price;
            const owns = item.id === 'luckPotion' ? state.luckLevel : 0;
            return `<div class="shop-item ${owned ? 'owned' : ''}">
              <span class="shop-icon" aria-hidden="true">${item.icon}</span>
              <div class="shop-info">
                <div class="shop-head"><strong class="shop-name">${item.name}</strong><span class="shop-tag">${item.tag}</span></div>
                <p class="shop-desc">${item.desc}${owns ? `<br><strong>已喝 ${owns} 瓶，目前 +${owns * 5}%</strong>` : ''}</p>
                <button class="shop-buy" type="button" data-id="${item.id}" ${owned || !afford ? 'disabled' : ''}>${owned ? '已购买 ✓' : `买 ${cash(price)}${hasDiscount ? `（原价${item.price}）` : ''}`}</button>
              </div>
            </div>`;
          }).join('')}</div>
          <div id="feedback" class="feedback">道具只在下一轮生效，请按需购买。买好了再按下面的按钮。</div>
          <div class="report-next">
            <span class="auto-next">⏸ 购物不计时，慢慢挑</span>
            <button id="shopContinueBtn" class="secondary-btn" type="button">${wheelUnlocked ? '买好了，下一步 →' : '进入下一轮 →'}</button>
          </div>`;
        stage.querySelectorAll('.shop-buy').forEach(btn => btn.addEventListener('click', () => buyShopItem(btn.dataset.id)));
        $('#shopContinueBtn').addEventListener('click', () => (wheelUnlocked ? renderWheelPrompt() : proceedFromShop()));
      }

      function buyShopItem(id) {
        if (state.phase !== 'shop') return;
        const item = shopItems.find(i => i.id === id);
        if (!item) return;
        if (!item.repeat && state.activeEffects[item.id]) return;
        const price = itemPrice(item);
        if (state.money < price) { toast('金币不够，买不起这个道具。'); return; }
        const before = state.money;
        state.money -= price;
        if (item.id === 'luckPotion') state.luckLevel += 1;
        else state.activeEffects[item.id] = true;
        state.pendingLedger.push({ label: `商店购买：${item.name}`, value: -price, equation: `${cash(before)} − ${price}金币 = ${cash(state.money)}` });
        updateHUD();
        flashDelta(-price);
        toast(item.id === 'luckPotion' ? `喝下幸运药水！幸运值升到 ${state.luckLevel} 级（全部游戏 +${state.luckLevel * 5}%）` : `已购买「${item.name}」，下一轮生效！`);
        renderShopStage();
      }

      function renderWheelPrompt() {
        if (!['shop', 'shop-prompt'].includes(state.phase)) return;
        state.phase = 'shop-prompt';
        stopPhaseTimer('🎡 停止计时');
        stage.innerHTML = `
          <div class="stage-kicker">🎡 幸运轮盘</div>
          <h2 class="stage-title">你要抽奖吗？</h2>
          <p class="stage-text">转一次10金币，从小猪扑满里扣。金币不足或总金币是负数时不能玩，中奖效果立即生效。</p>
          <div class="decision-actions">
            <button class="choice-btn trust" type="button" id="wheelYesBtn">要抽奖 🎡</button>
            <button class="choice-btn refuse" type="button" id="wheelNoBtn">不要抽奖</button>
          </div>
          <div id="feedback" class="feedback">⏸ 这里不计时，想清楚再决定。</div>`;
        $('#wheelYesBtn').addEventListener('click', renderWheel);
        $('#wheelNoBtn').addEventListener('click', proceedFromShop);
      }

      function renderWheel() {
        if (state.phase !== 'shop-prompt') return;
        state.phase = 'wheel';
        renderWheelStage();
      }

      function renderWheelStage() {
        const wheelDisabled = state.money < 0 || state.money < 10 || state.wheelSpinning;
        const wheelDisableReason = state.money < 0 ? '总现金是负数，暂时不能玩轮盘。' : (state.money < 10 ? '现金不足10金币，无法转轮盘。' : '');
        stage.innerHTML = `
          <div class="stage-kicker">🎡 幸运轮盘</div>
          <h2 class="stage-title">转吧，看看手气如何！</h2>
          <p class="stage-text">10金币/次，可以连续转，钱不够或总现金是负数时就不能再玩了。</p>
          <div class="wheel-wrap">
            <div class="wheel-pointer" aria-hidden="true">▼</div>
            <div id="wheelDial" class="wheel-dial">${wheelSegments.map(seg => `<span class="wheel-slice-label" style="transform: rotate(${seg.angle}deg) translateY(var(--label-offset)) rotate(${-seg.angle}deg);"><span>${seg.icon}</span><span>${seg.wheelText || seg.label}</span></span>`).join('')}</div>
          </div>
          <button id="wheelSpinBtn" class="secondary-btn" type="button" ${wheelDisabled ? 'disabled' : ''}>转一次 10金币</button>
          ${wheelDisableReason ? `<p class="stage-text" style="margin-top:8px">${wheelDisableReason}</p>` : ''}
          <div id="wheelResult" class="wheel-result" hidden></div>
          <div class="report-next">
            <span class="auto-next">⏸ 抽奖不计时，转完再继续</span>
            <button id="shopContinueBtn" class="secondary-btn" type="button">进入下一轮 →</button>
          </div>`;
        const dial = $('#wheelDial');
        if (dial) { dial.style.transition = 'none'; dial.style.transform = `rotate(${state.wheelRotation % 360}deg)`; }
        const spinBtn = $('#wheelSpinBtn');
        if (spinBtn) spinBtn.addEventListener('click', spinWheel);
        $('#shopContinueBtn').addEventListener('click', proceedFromShop);
      }

      function spinWheel() {
        if (state.phase !== 'wheel' || state.wheelSpinning) return;
        if (state.money < 0) { toast('总现金是负数，暂时不能玩轮盘。'); return; }
        if (state.money < 10) { toast('现金不足10金币，无法转轮盘。'); return; }
        const before = state.money;
        state.money -= 10;
        state.pendingLedger.push({ label: '幸运轮盘费用', value: -10, equation: `${cash(before)} − 10金币 = ${cash(state.money)}` });
        updateHUD();
        flashDelta(-10);
        state.wheelSpinning = true;
        const spinBtn = $('#wheelSpinBtn');
        if (spinBtn) spinBtn.disabled = true;
        let chosen = pickWeighted(wheelSegments);
        if (chosen.cash < 0 && Math.random() < Math.min(.6, luckBonus() * 2)) chosen = pickWeighted(wheelSegments.filter(x => (x.cash || 0) >= 0 || x.grantLuck || x.grantEffect));
        const base = ((state.wheelRotation % 360) + 360) % 360;
        const targetOffset = (360 - chosen.angle) % 360;
        let delta = targetOffset - base;
        if (delta <= 0) delta += 360;
        const spins = (4 + Math.floor(Math.random() * 3)) * 360;
        state.wheelRotation += spins + delta;
        const dial = $('#wheelDial');
        const wrap = document.querySelector('.wheel-wrap');
        if (dial) {
          dial.style.transition = 'transform 3.2s cubic-bezier(.17,.67,.16,1.01)';
          dial.style.transform = `rotate(${state.wheelRotation}deg)`;
        }
        if (wrap) wrap.classList.add('spinning');
        const resultBox = $('#wheelResult');
        if (resultBox) { resultBox.hidden = true; resultBox.className = 'wheel-result'; }
        playWheelTicks(3200);
        queueTransition(() => applyWheelPrize(chosen), 3200, 'wheel');
      }

      function applyWheelPrize(seg) {
        state.wheelSpinning = false;
        const wrap = document.querySelector('.wheel-wrap');
        if (wrap) wrap.classList.remove('spinning');
        const isBigWin = (seg.cash || 0) >= 20 || Boolean(seg.grantEffect) || Boolean(seg.grantLuck);
        const isLoss = (seg.cash || 0) < 0;
        const resultBox = $('#wheelResult');
        if (resultBox) {
          resultBox.hidden = false;
          resultBox.className = `wheel-result show ${isLoss ? 'loss' : isBigWin ? 'jackpot' : 'win'}`;
          resultBox.innerHTML = `<span class="wheel-result-icon">${seg.icon}</span><strong>${seg.label}</strong><span>${seg.grantLuck ? '幸运值永久 +1 级！' : seg.grantEffect ? '免费道具，下一轮生效！' : seg.cash ? signed(seg.cash) : '这次没中奖，再试一次？'}</span>`;
        }
        if (typeof seg.cash === 'number' && seg.cash !== 0) {
          const before = state.money;
          state.money += seg.cash;
          state.pendingLedger.push({ label: `幸运轮盘：${seg.label}`, value: seg.cash, equation: `${cash(before)} ${seg.cash >= 0 ? '+' : '−'} ${Math.abs(seg.cash)}金币 = ${cash(state.money)}` });
          updateHUD();
          flashDelta(seg.cash);
        }
        if (seg.grantLuck) {
          state.luckLevel += seg.grantLuck;
          state.pendingLedger.push({ label: `幸运轮盘：${seg.label}`, value: 0, equation: `幸运值升到 ${state.luckLevel} 级` });
        }
        if (seg.grantEffect) {
          state.activeEffects[seg.grantEffect] = true;
          state.pendingLedger.push({ label: `幸运轮盘：${seg.label}`, value: 0, equation: '获得免费道具，现金不变' });
        }
        if (isBigWin) playFanfare();
        else if (!seg.cash) playResult(false);
        toast(`轮盘结果：${seg.label}${seg.grantLuck ? '，幸运值永久提升！' : seg.grantEffect ? '，下一轮生效！' : ''}`);
        const spinBtn = $('#wheelSpinBtn');
        if (spinBtn) spinBtn.disabled = state.money < 10;
        updateHUD();
      }

      function proceedFromShop() {
        if (!['shop', 'shop-prompt', 'wheel'].includes(state.phase)) return;
        if (state.wheelSpinning) { toast('轮盘还在转动，等结果出来再继续吧！'); return; }
        state.session += 1;
        beginSession();
      }

      function renderJobReveal() {
        state.phase = 'job-reveal';
        clearInterval(state.timerId);
        state.timerId = null;
        updateHUD();
        $('#timer').textContent = '准备！';
        $('#timer').classList.remove('warning');
        const avatarHTML = state.job.photo
          ? `<div class="job-reveal-avatar"><img class="job-reveal-photo" src="${state.job.photo}" alt="${state.job.name}职业插画"><span class="job-reveal-icon-badge">${state.job.icon}</span></div>`
          : `<div class="job-reveal-icon" aria-hidden="true">${state.job.icon}</div>`;
        stage.innerHTML = `
          <div class="job-reveal">
            <div>
              <div class="stage-kicker">🎲 第一天 · 随机抽职业</div>
              ${avatarHTML}
              <h2 class="stage-title">你抽到了：${state.job.name}</h2>
              <p class="stage-text">${state.job.desc}</p>
              <p class="job-income">${state.job.perk}</p>
              <p class="job-trait good">👍 好处：${state.job.good}</p>
              <p class="job-trait bad">👎 坏处：${state.job.bad}</p>
              <button id="beginSessionBtn" class="secondary-btn" type="button">开始第1–3天 →</button>
            </div>
          </div>`;
        const begin = () => {
          if (state.phase !== 'job-reveal') return;
          clearTimeout(state.transitionTimerId);
          state.transitionTimerId = null;
          beginSession();
        };
        $('#beginSessionBtn').addEventListener('click', begin);
        queueTransition(begin, 6000, 'job-reveal');
      }

      function renderActiveEffects() {
        const chips = shopItems
          .filter(item => !item.repeat && state.activeEffects[item.id])
          .map(item => `<span class="effect-chip" title="${item.desc}">${item.icon} ${item.name}</span>`);
        if (state.luckLevel > 0) {
          chips.unshift(`<span class="effect-chip" title="每喝一瓶幸运药水，全部游戏永久 +5% 有利">🧪 幸运 ${state.luckLevel} 级（+${state.luckLevel * 5}%）</span>`);
        }
        const card = $('#effectsCard');
        const list = $('#effectsList');
        if (!chips.length) { card.hidden = true; list.innerHTML = ''; return; }
        card.hidden = false;
        list.innerHTML = chips.join('');
      }

      function walkAvatarHTML() {
        return state.job.photo
          ? `<img src="${state.job.photo}" alt="${state.job.name}">`
          : `<span class="walk-avatar-icon">${state.job.icon}</span>`;
      }

      function walkPositionPercent(position) {
        return `${((position + 10.5) / 21) * 100}%`;
      }

      function renderWalk() {
        state.phase = 'walk';
        const range = state.job.trait === 'shortWalk' ? 3 : 5;
        state.walkSteps = [randomStep(range), randomStep(range)];
        state.walkTarget = state.walkSteps[0] + state.walkSteps[1];
        state.walkPosition = 0;
        renderWalkStage();
        startPhaseTimer('walk', walkTimeout);
      }

      function renderWalkStage() {
        const [step1, step2] = state.walkSteps;
        const latePenalty = state.job.trait === 'lateShield' ? '只扣25%（摩托车代步）' : '减半';
        const shortNote = state.job.trait === 'shortWalk' ? '（店员路程短，只走 −3～3 步）' : '';
        const ticks = [];
        for (let i = -10; i <= 10; i += 1) ticks.push(`<span class="walk-tick ${i === 0 ? 'zero' : ''}">${mathNumber(i)}</span>`);
        stage.innerHTML = `
          <div class="stage-kicker">🚶 走路去工作</div>
          <h2 class="stage-title">用左右箭头，把${state.job.name}走到正确的位置！</h2>
          <p class="stage-text">起点是 0，今天要走两段路：先 <strong>${walkStepLabel(step1)}</strong>，再 <strong>${walkStepLabel(step2)}</strong>${shortNote}。左边是负数，右边是正数——走到你认为对的位置，再按「到了，打卡上班」。走对了准时领全额收入，走错了算迟到，收入${latePenalty}！</p>
          <div class="walk-line-wrap">
            <div class="walk-avatar-track"><div id="walkAvatarToken" class="walk-avatar-token" style="left:${walkPositionPercent(state.walkPosition)}">${walkAvatarHTML()}</div></div>
            <div class="walk-ticks">${ticks.join('')}</div>
          </div>
          <div class="walk-controls">
            <button id="walkLeftBtn" class="secondary-btn walk-arrow-btn" type="button">◀ 左（−1）</button>
            <span class="walk-position-readout">现在位置：<span id="walkPositionText">${mathNumber(state.walkPosition)}</span></span>
            <button id="walkRightBtn" class="secondary-btn walk-arrow-btn" type="button">右（+1）▶</button>
          </div>
          <div class="walk-controls">
            <button id="walkResetBtn" class="choice-btn" type="button">回到起点 0</button>
            <button id="walkConfirmBtn" class="primary-btn walk-confirm-btn" type="button" style="grid-column:auto">到了，打卡上班 ✅</button>
          </div>
          <div id="feedback" class="feedback">起点是 0，先算一算两步之后会在哪里，再用箭头走过去。</div>`;
        $('#walkLeftBtn').addEventListener('click', () => moveWalk(-1));
        $('#walkRightBtn').addEventListener('click', () => moveWalk(1));
        $('#walkResetBtn').addEventListener('click', () => moveWalk(0, true));
        $('#walkConfirmBtn').addEventListener('click', confirmWalk);
      }

      function moveWalk(delta, resetToZero = false) {
        if (state.phase !== 'walk') return;
        const previous = state.walkPosition;
        state.walkPosition = resetToZero ? 0 : Math.max(-10, Math.min(10, state.walkPosition + delta));
        const token = $('#walkAvatarToken');
        if (token) {
          token.style.left = walkPositionPercent(state.walkPosition);
          token.classList.toggle('facing-left', state.walkPosition < previous);
          token.classList.remove('stepping');
          void token.offsetWidth;
          token.classList.add('stepping');
        }
        const posText = $('#walkPositionText');
        if (posText) posText.textContent = mathNumber(state.walkPosition);
        if (state.walkPosition !== previous || resetToZero) playStep(state.walkPosition - previous);
      }

      function confirmWalk() {
        if (state.phase !== 'walk') return;
        state.phase = 'walk-result';
        stopPhaseTimer(state.walkPosition === state.walkTarget ? '✅' : '⏰');
        const onTime = state.walkPosition === state.walkTarget;
        state.walkOnTime = onTime;
        const [step1, step2] = state.walkSteps;
        const lateText = state.job.trait === 'lateShield' ? '只扣25%' : '减半';
        state.ledger.push({ label: onTime ? '走路去工作：准时打卡' : '走路去工作：迟到了', value: 0, equation: `0 + ${operatorNumber(step1)} + ${operatorNumber(step2)} = ${mathNumber(state.walkTarget)}` });
        if (onTime) playFanfare();
        else playResult(false);
        ['walkLeftBtn', 'walkRightBtn', 'walkResetBtn', 'walkConfirmBtn'].forEach(id => { const el = $(`#${id}`); if (el) el.disabled = true; });
        $('#feedback').className = `feedback ${onTime ? 'success' : 'error'}`;
        $('#feedback').innerHTML = onTime
          ? `准时打卡！0 + ${operatorNumber(step1)} + ${operatorNumber(step2)} = ${mathNumber(state.walkTarget)}，算对了，今天领全额收入。`
          : `你停在了 ${mathNumber(state.walkPosition)}，但正确位置是 0 + ${operatorNumber(step1)} + ${operatorNumber(step2)} = ${mathNumber(state.walkTarget)}。你迟到了，今天收入${lateText}。${numberLineHTML(state.walkTarget)}`;
        queueTransition(renderQuestion, 2200, 'walk-result');
      }

      function beginSession() {
        clearTimeout(state.transitionTimerId);
        state.transitionTimerId = null;
        state.sessionStartMoney = state.pendingLedger.length ? state.shopOpeningMoney : state.money;
        state.ledger = state.pendingLedger.length ? [...state.pendingLedger] : [];
        state.pendingLedger = [];
        state.drawChoices = 1;
        state.answerCorrect = false;
        state.selectedCategory = null;
        state.walkOnTime = true;
        updateHUD();
        renderActiveEffects();
        renderWalk();
      }

      function titleForMoney(money) {
        if (money >= 35) return { icon: '🐉', title: '咸鱼变锦鲤', note: `从 −5 金币一路翻到 ${cash(money)}，数学和判断力都很到位！` };
        if (money >= 20) return { icon: '🏆', title: '翻身成功', note: '你不但还清了欠款，还赚了一笔，咸鱼正式翻身！' };
        if (money >= 0) return { icon: '🌱', title: '刚好上岸', note: '从负数爬回正数已经很不容易，下一局试试冲更高！' };
        return { icon: '🐟', title: '还是咸鱼（但更懂负数了）', note: '虽然还是负数，但你已经看懂欠款怎么算。再来一局，一定能翻身！' };
      }

      function endGame() {
        state.phase = 'end';
        clearInterval(state.timerId);
        clearInterval(state.reportTimerId);
        clearTimeout(state.transitionTimerId);
        state.transitionTimerId = null;
        stopMusic();
        const result = titleForMoney(state.money);
        const accuracy = state.attempted ? Math.round(state.correct / state.attempted * 100) : 0;
        showScreen('endScreen');
        $('#endContent').innerHTML = `
          <div class="trophy" aria-hidden="true">${result.icon}</div>
          <p class="eyebrow" style="margin-inline:auto">一星期翻身挑战完成</p>
          <h1 id="endTitle" class="end-title">${result.title}</h1>
          <p class="end-subtitle">${state.player} · ${state.job.icon} ${state.job.name}</p>
          <div class="end-money ${state.money < 0 ? 'money negative' : ''}">${cash(state.money)}</div>
          <div class="summary-grid">
            <div class="summary-item"><span>完成天数</span><strong>${TOTAL_DAYS}天</strong></div>
            <div class="summary-item"><span>答题正确率</span><strong>${accuracy}%</strong></div>
            <div class="summary-item"><span>未作答</span><strong>${state.unanswered}题</strong></div>
            <div class="summary-item"><span>避开风险</span><strong>${state.avoided}次</strong></div>
          </div>
          <p class="end-note">${result.note}</p>
          <div class="end-actions"><button id="restartBtn" class="primary-btn" type="button">再创业一次</button></div>`;
        $('#restartBtn').addEventListener('click', resetGame);
        playResult(true);
      }

      function resetGame() {
        clearInterval(state.timerId);
        clearInterval(state.reportTimerId);
        clearInterval(state.ninjaSpawnId);
        clearTimeout(state.ninjaRoundId);
        clearTimeout(state.reelTimer);
        clearTimeout(state.transitionTimerId);
        stopMusic();
        Object.assign(state, {
          player: '', date: '', money: START_MONEY, session: 1, job: null, correct: 0,
          attempted: 0, unanswered: 0, avoided: 0, phase: 'idle', attempts: 0,
          question: null, cards: [], revealed: new Set(), timer: 0,
          timerId: null, reportTimerId: null, transitionTimerId: null, reportSeconds: REPORT_SECONDS,
          sessionStartMoney: START_MONEY, ledger: [],
          drawChoices: 1,
          answerCorrect: false, selectedCategory: null,
          activeEffects: { doubleNext: false }, luckLevel: 0,
          shopOpeningMoney: START_MONEY, pendingLedger: [],
          walkSteps: [0, 0], walkTarget: 0, walkPosition: 0, walkOnTime: true,
          wheelRotation: 0, wheelSpinning: false,
          fishNumbers: [], fishCastsLeft: 0, fishCasting: false, reelValue: 0, reelTimer: null,
          ninjaTarget: 0, ninjaRound: 0, ninjaTargets: [], ninjaRoundId: null, ninjaEarned: 0, ninjaHits: 0, ninjaMiss: 0, ninjaSpawnId: null
        });
        $('#effectsCard').hidden = true;
        $('#startForm').reset();
        showScreen('startScreen');
        $('#playerName').focus();
      }

      $('#startForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const name = $('#playerName').value.trim();
        if (!name) return;
        state.player = name;
        state.job = pick(jobs);
        state.money = START_MONEY;
        $('#jobIcon').textContent = state.job.icon;
        const jobPhotoEl = $('#jobPhoto');
        if (state.job.photo) {
          jobPhotoEl.src = state.job.photo;
          jobPhotoEl.alt = `${state.job.name}职业插画`;
          jobPhotoEl.hidden = false;
        } else {
          jobPhotoEl.hidden = true;
          jobPhotoEl.removeAttribute('src');
        }
        $('#jobName').textContent = state.job.name;
        $('#jobDesc').textContent = state.job.desc;
        $('#jobIncome').textContent = state.job.perk;
        $('#jobGood').textContent = `👍 ${state.job.good}`;
        $('#jobBad').textContent = `👎 ${state.job.bad}`;
        ensureAudio();
        beginMusic();
        showScreen('gameScreen');
        renderJobReveal();
      });

      $('#soundBtn').addEventListener('click', () => {
        state.sound = !state.sound;
        $('#soundBtn').textContent = state.sound ? '🔊' : '🔇';
        $('#soundBtn').setAttribute('aria-label', state.sound ? '关闭声音' : '开启声音');
        $('#soundBtn').title = state.sound ? '关闭声音' : '开启声音';
        if (state.sound) { ensureAudio(); beginMusic(); beep(523, .12); }
        else stopMusic();
      });

      const startCard = $('.start-card');
      startCard.addEventListener('pointermove', (event) => {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const rect = startCard.getBoundingClientRect();
        const x = 50 + ((event.clientX - rect.left) / rect.width - .5) * 5;
        const y = 50 + ((event.clientY - rect.top) / rect.height - .5) * 4;
        startCard.style.setProperty('--look-x', `${x}%`);
        startCard.style.setProperty('--look-y', `${y}%`);
      });
      startCard.addEventListener('pointerleave', () => {
        startCard.style.removeProperty('--look-x');
        startCard.style.removeProperty('--look-y');
      });
    })();
  </script>
</body>
</html>
